<title>Codekraker ℕ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: één kolom (max 720px). Bewuste donkere museumsfeer: groen fluweel, messing en perkament. Plattegrond als bouwtekening. */
:root{
  --bg:#12211e; --bg2:#182c28; --panel:#1d3530; --line:#2f4d46; --plan:#9fc2b8;
  --paper:#efe4cc; --ink:#f3ecdc; --ink-soft:#b5c4bb; --brass:#d6a84e; --brass-deep:#9c7428; --brass-ink:#2a1d05;
  --ok:#7fd1a0; --ok-bg:#1f4434; --no:#ff8a7a; --no-bg:#4a2621; --lock:#5c756e;
  --f-display:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#24403a 0,transparent 60%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:16px 48px;min-height:100vh}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:12px 22px;font-weight:600;background:var(--brass);color:var(--brass-ink);box-shadow:0 3px 0 var(--brass-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brass-deep)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{padding:7px 14px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:600}
.soft{color:var(--ink-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* start */
.title{font-size:clamp(3.2rem,15vw,6rem);color:var(--brass);text-shadow:0 2px 0 var(--brass-deep)}
.title small{display:block;font-size:.32em;color:var(--ink);letter-spacing:.3em;margin-bottom:6px}
.story{max-width:60ch}
.field{display:grid;gap:6px}
.field input{font:inherit;padding:12px 14px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:320px;width:100%}

/* bovenbalk */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar h2{font-size:1.6rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;font-size:.92rem}

/* plattegrond */
.plan{position:relative;border:2px solid var(--plan);border-radius:4px;padding:14px;background:
  linear-gradient(var(--bg2),var(--bg2)) padding-box;background-image:linear-gradient(rgba(159,194,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(159,194,184,.07) 1px,transparent 1px);background-size:20px 20px}
.plan-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;font-family:var(--f-display);color:var(--plan);letter-spacing:.12em;text-transform:uppercase;font-size:.95rem}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.room{position:relative;text-align:left;border:2px dashed var(--plan);border-radius:4px;padding:14px 14px 12px;background:rgba(18,33,30,.6);display:grid;gap:6px;min-width:0}
.room:hover:not(:disabled){border-style:solid;background:rgba(214,168,78,.08)}
.room:disabled{cursor:not-allowed;opacity:.5}
.room .let{font-family:var(--f-display);font-size:2.2rem;color:var(--plan);line-height:.9}
.room b{font-size:1rem}
.room .tp{font-size:.82rem;color:var(--ink-soft)}
.room .st{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.room.done{border-style:solid;border-color:var(--brass)}
.room.done .let{color:var(--brass)}
.digit{font-family:var(--f-display);font-size:1.4rem;min-width:34px;height:40px;display:grid;place-items:center;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--brass)}
.room.vault{grid-column:1/-1;border-color:var(--brass);border-style:solid;grid-template-columns:auto 1fr;align-items:center;gap:14px}
.room.vault .codes{display:flex;gap:6px}
.door{position:absolute;width:26px;height:6px;background:var(--bg2);border-left:2px solid var(--plan);border-right:2px solid var(--plan)}
.teacher{font-size:.9rem;color:var(--ink-soft)}
.teacher summary{cursor:pointer;font-weight:600}
.teacher .inner{display:grid;gap:10px;padding-top:10px}

/* slot */
.lockwrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dials{display:flex;gap:6px}
.dial{width:38px;height:52px;border-radius:6px;background:linear-gradient(#0b1513,#24403a 45%,#24403a 55%,#0b1513);border:2px solid var(--brass-deep);display:grid;place-items:center;font-family:var(--f-display);font-size:1.7rem;color:var(--lock);overflow:hidden}
.dial.on{color:var(--brass);border-color:var(--brass)}
.dial.bad{color:var(--no);border-color:var(--no)}
.dial.spin span{display:block;animation:spin .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{from{transform:translateY(-120%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.dial.spin span{animation:none}}

/* puzzel */
.qcard{display:grid;gap:16px}
.qcard>*{min-width:0}
.instr{font-weight:600}
.math{font-size:clamp(1.6rem,6.5vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere;background:var(--paper);color:#22301f;padding:14px 18px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.math.wordy{font-size:1.12rem;line-height:1.5}
.blank{display:inline-block;min-width:1.4em;text-align:center;border-bottom:3px solid var(--brass-deep)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.cmp{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.words{grid-template-columns:1fr 1fr}
.opt{position:relative;border:2px solid var(--line);background:var(--bg2);border-radius:10px;padding:14px 10px 14px 34px;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere;text-align:left}
.opt::before{content:"";position:absolute;left:12px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:2px solid var(--brass);box-shadow:6px 0 0 -3px var(--brass)}
.opts.cmp .opt{font-size:2rem;text-align:center;padding:6px}
.opts.cmp .opt::before,.opts.words .opt::before{display:none}
.opts.words .opt{font-size:1rem;text-align:center;padding:14px}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--no);background:var(--no-bg);text-decoration:line-through}
.opt:disabled{cursor:default}
.pad{display:grid;gap:10px;max-width:340px;width:100%;margin:0 auto}
.screen{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:62px;padding:8px 16px;border-radius:8px;background:#0b1513;border:2px solid var(--brass-deep);font-family:var(--f-display);font-size:2.4rem;color:var(--brass);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.screen .unit{font-family:var(--f-body);font-size:.95rem;color:var(--ink-soft);letter-spacing:0}
.screen .cur{width:3px;height:1.1em;background:var(--brass);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{padding:12px 0;font-size:1.4rem;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--bg2);box-shadow:0 3px 0 #0b1513}
.keys button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b1513}
.keys .ok{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);box-shadow:0 3px 0 var(--brass-deep)}
.nlbox{overflow-x:auto}
.nlbox svg{display:block;width:100%;height:auto}
.hint{font-size:.88rem;color:var(--ink-soft)}
.warn{color:var(--no);font-weight:600}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--no-bg)}
.fb h3{font-size:1.6rem}
.fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--no)}
.fb .st{display:block;font-variant-numeric:tabular-nums}
.fb .row{justify-content:flex-end}
.tipbox{border-left:4px solid var(--brass);padding:10px 14px;background:var(--bg2);border-radius:0 8px 8px 0}
.tipbox h3{font-size:1.3rem;color:var(--brass);margin-bottom:4px}
.tbl-wrap{overflow-x:auto;margin:6px 0}
.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 12px;text-align:center}
.tbl th{text-align:left;font-weight:600;color:var(--ink-soft)}
.result{display:grid;gap:14px;justify-items:center;text-align:center}
.result h2{font-size:2.6rem;color:var(--brass)}
.bigdigit{font-family:var(--f-display);font-size:5rem;line-height:1;width:110px;height:130px;display:grid;place-items:center;border-radius:12px;background:#0b1513;border:3px solid var(--brass);color:var(--brass)}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media (max-width:480px){body{font-size:16px}.panel{padding:16px}.rooms{grid-template-columns:1fr}.dial{width:32px;height:46px;font-size:1.45rem}}
</style>
<div id="app" aria-live="polite"></div>
<script>/* ===== Expeditie ℤ — logica: hulpfuncties, veeltermen, generatoren ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const nz=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const nzx=(a,b,ex)=>{let v;do{v=R(a,b)}while(v===0||ex.includes(v));return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MIN='−';
const f=n=>n<0?MIN+(-n):String(n);
const p=n=>n<0?'('+f(n)+')':f(n);
const SUPC={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const SUBC={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sup=n=>String(n).split('').map(c=>SUPC[c]||c).join('');
const sub=n=>String(n).split('').map(c=>SUBC[c]||c).join('');
const isInt=x=>Number.isInteger(x);

/* ---------- veeltermen ---------- */
function vexp(k){const m={};for(const x of k.matchAll(/([a-z])(\d+)/g))m[x[1]]=(m[x[1]]||0)+ +x[2];return m}
function vkey(m){return Object.keys(m).filter(v=>m[v]!==0).sort().map(v=>v+m[v]).join('')}
function clean(a){const r={};for(const k in a)if(Math.abs(a[k])>1e-9)r[k]=a[k];return r}
function padd(a,b){const r={...a};for(const k in b)r[k]=(r[k]||0)+b[k];return clean(r)}
function pneg(a){const r={};for(const k in a)r[k]=-a[k];return r}
function pmul(a,b){const r={};for(const ka in a)for(const kb in b){const m=vexp(ka),n=vexp(kb);for(const v in n)m[v]=(m[v]||0)+n[v];const k=vkey(m);r[k]=(r[k]||0)+a[ka]*b[kb]}return clean(r)}
function pdiv(a,b){const ks=Object.keys(b);if(ks.length!==1)throw new Error('deling');const kb=ks[0],cb=b[kb];const r={};for(const ka in a){const m=vexp(ka),n=vexp(kb);for(const v in n){m[v]=(m[v]||0)-n[v];if(m[v]<0)throw new Error('deling')}const k=vkey(m);r[k]=(r[k]||0)+a[ka]/cb}return clean(r)}
function ppow(a,n){if(!isInt(n)||n<0||n>20)throw new Error('exp');let r={'':1};for(let i=0;i<n;i++)r=pmul(r,a);return r}
function pequal(a,b){const d=padd(a,pneg(b));return Object.keys(d).length===0}
function pconst(a){const ks=Object.keys(a);if(ks.length===0)return 0;if(ks.length===1&&ks[0]==='')return a[''];return null}

function normalize(s){
  s=String(s).toLowerCase().replace(/[−–—]/g,'-').replace(/[·×∙•*⋅]/g,'*').replace(/[:÷\/]/g,'/');
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>Object.keys(SUPC).find(k=>SUPC[k]===c)).join(''));
  return s.replace(/\s+/g,'');
}
function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];
  if(/\d/.test(c)){let j=i;while(j<s.length&&/[\d.]/.test(s[j]))j++;t.push({t:'n',v:parseFloat(s.slice(i,j))});i=j}
  else if(/[a-z]/.test(c)){t.push({t:'v',v:c});i++}
  else if('+-*/^()'.includes(c)){t.push({t:c});i++}
  else throw new Error('teken')}return t}
function parsePoly(str){
  const t=tokenize(normalize(str));if(!t.length)throw new Error('leeg');let i=0;
  const pk=()=>t[i];
  function expr(){let r=term();while(pk()&&(pk().t==='+'||pk().t==='-')){const op=t[i++].t;const b=term();r=op==='+'?padd(r,b):padd(r,pneg(b))}return r}
  function term(){let r=factor();for(;;){const n=pk();if(!n)break;
    if(n.t==='*'){i++;r=pmul(r,factor())}
    else if(n.t==='/'){i++;r=pdiv(r,factor())}
    else if(n.t==='v'||n.t==='('){r=pmul(r,power())}
    else break}return r}
  function factor(){const n=pk();if(!n)throw new Error('einde');
    if(n.t==='-'){i++;return pneg(factor())}if(n.t==='+'){i++;return factor()}return power()}
  function power(){let b=atom();if(pk()&&pk().t==='^'){i++;let e;
      if(pk()&&pk().t==='n'){e=t[i++].v}
      else if(pk()&&pk().t==='('){i++;if(!pk()||pk().t!=='n')throw new Error('exp');e=t[i++].v;if(!pk()||pk().t!==')')throw new Error('exp');i++}
      else throw new Error('exp');
      b=ppow(b,e)}return b}
  function atom(){const n=t[i++];if(!n)throw new Error('einde');
    if(n.t==='n')return clean({'':n.v});
    if(n.t==='v')return {[n.v+'1']:1};
    if(n.t==='('){const r=expr();if(!pk()||pk().t!==')')throw new Error('haakje');i++;return r}
    throw new Error('syntax')}
  const r=expr();if(i!==t.length)throw new Error('rest');return r;
}
function isSimplified(raw,target){
  const s=normalize(raw);if(/[()\/]/.test(s))return false;
  const terms=s.replace(/^[+-]/,'').split(/[+-]/);
  if(terms.some(x=>x===''))return false;
  for(const x of terms){const y=x.replace(/\^\d+/g,'');const nums=y.match(/\d+(\.\d+)?/g)||[];const vars=y.match(/[a-z]/g)||[];
    if(nums.length>1)return false;if(new Set(vars).size!==vars.length)return false;if(/\^/.test(y))return false}
  const n=Math.max(1,Object.keys(target).length);
  return terms.length===n;
}
const VORDER=['a','b','x','y'];
function fmtNum(n){return isInt(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function fmtPoly(pl){
  const ks=Object.keys(pl);if(!ks.length)return '0';
  const deg=k=>Object.values(vexp(k)).reduce((s,e)=>s+e,0);
  ks.sort((x,y)=>{const d=deg(y)-deg(x);if(d)return d;const ex=vexp(x),ey=vexp(y);for(const v of VORDER){const c=(ey[v]||0)-(ex[v]||0);if(c)return c}return 0});
  return ks.map((k,i)=>{const c=pl[k],a=Math.abs(c);const m=vexp(k);
    const vars=Object.keys(m).sort().map(v=>v+(m[v]===1?'':sup(m[v]))).join('');
    const core=(a===1&&vars?'':fmtNum(a))+vars;
    return i===0?(c<0?MIN:'')+core:(c<0?' '+MIN+' ':' + ')+core}).join('');
}

/* ---------- meerkeuze ---------- */
function intOptions(v,wrongs,extra){
  const lab=x=>typeof x==='number'?f(x):x;
  const seen=new Set([lab(v)]);const o=[{label:lab(v),correct:true}];
  const add=w=>{if(o.length>=4)return;if(typeof w==='number'&&!isInt(w))return;const l=lab(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  (extra||[]).forEach(add);wrongs.forEach(add);
  let g=0;while(o.length<4&&g++<80){const base=typeof v==='number'?v:0;add(pick([-base,base+nz(-6,6),base+nz(-3,3),base*2]))}
  return shuffle(o);
}
/* ===== Codekraker ℕ — generatoren ===== */
const D='·';
const stepsN=(start,arr)=>`<span class="st">${start}</span>`+arr.map(s=>`<span class="st">= ${s}</span>`).join('');
const fin=v=>`<b>${v}</b>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
function natOptions(v,wrongs){const seen=new Set([String(v)]);const o=[{label:String(v),correct:true}];
  const add=w=>{if(o.length>=4)return;if(!isInt(w)||w<0)return;const l=String(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  wrongs.forEach(add);let g=0;while(o.length<4&&g++<80)add(v+nz(-Math.max(3,Math.round(v*.2)),Math.max(3,Math.round(v*.2))));return shuffle(o)}
function numQ(mode,{instr,math,v,wrongs=[],explain,unit=''}){const q={instr,math,explain,answerLabel:v+(unit?' '+unit:''),unit};
  if(mode==='mc')q.options=natOptions(v,wrongs);else{q.kind='num';q.value=v}return q}
function natPerturb(pl){const r={...pl};const ks=Object.keys(r);const k=pick(ks);const t=R(0,2);
  if(t===0||t===1){r[k]=Math.max(1,r[k]+pick([1,2,-1,1]));if(r[k]===pl[k])r[k]+=1}
  else{const m=vexp(k);const v=Object.keys(m)[0];if(v){m[v]=m[v]===1?2:m[v]-1;const c=r[k];delete r[k];const nk=vkey(m);r[nk]=(r[nk]||0)+c}else r[k]+=2}
  return clean(r)}
function polyOptions(target,wrongs){const seen=new Set([fmtPoly(target)]);const o=[{label:fmtPoly(target),correct:true}];
  const add=w=>{if(o.length>=4||!w)return;if(pequal(w,target))return;if(Object.values(w).some(c=>c<0))return;const l=fmtPoly(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  wrongs.forEach(w=>{try{add(typeof w==='string'?parsePoly(w):w)}catch(e){}});let g=0;while(o.length<4&&g++<80)add(natPerturb(target));return shuffle(o)}
const sqr=n=>`√${n}`,cbr=n=>`∛${n}`,lg=(b,x)=>`log${sub(b)} ${x}`;

/* ===== ZAAL A: bewerkingen ===== */
function genOps(mode){
  const I='Bereken. Let op de volgorde van de bewerkingen.';
  for(let g=0;g<200;g++){const t=R(0,14);let math,st,v,wr=[];
    if(t===0){const e=R(1,5),d=R(1,6),c=d+e,b=R(2,5),a=R(3,9);v=a*a-b*e;if(v<0)continue;math=`${a}² − ${b}${D}(${c} − ${d})`;st=[`${a*a} − ${b}${D}${e}`,`${a*a} − ${b*e}`,fin(v)];wr=[(a*a-b)*e,a*a-b*c-d]}
    if(t===1){const a=R(1,6),b=R(1,6),s=a+b,c=R(1,3);v=s*s-c**3;if(v<0||s<3)continue;math=`(${a} + ${b})² − ${c}³`;st=[`${s}² − ${c}³`,`${s*s} − ${c**3}`,fin(v)];wr=[a*a+b*b-c**3,s*2-c*3]}
    if(t===2){const s=R(2,12),c=R(1,4);v=s+c**3;math=`${sqr(s*s)} + ${c}³`;st=[`${s} + ${c**3}`,fin(v)];wr=[s*s/2+c**3,s+c*3]}
    if(t===3){const b=R(1,4),c=R(1,6),d=b*b+c,q=R(2,12),N=d*q;if(N>200)continue;v=q;math=`${N} : (${b}² + ${c})`;st=[`${N} : (${b*b} + ${c})`,`${N} : ${d}`,fin(v)];wr=[N/(b*b)+c,N/(2*b+c)]}

const RECHT=[
 {t:(x1,y1,x2)=>`Een auto verbruikt ${y1} liter benzine per ${x1} km. Hoeveel liter verbruikt hij voor ${x2} km?`,xu:'km',yu:'liter',g:[50,25,100],ym:[2,3,4,5]},
 {t:(x1,y1,x2)=>`${x1} kg tomaten kosten €${y1}. Hoeveel euro kosten ${x2} kg?`,xu:'kg',yu:'euro',g:[1,1,2,3],ym:[2,3,4,5,6]},
 {t:(x1,y1,x2)=>`Een drukker drukt ${y1} pagina's in ${x1} minuten. Hoeveel pagina's drukt hij in ${x2} minuten (zelfde tempo)?`,xu:'min',yu:"pagina's",g:[5,1,10],ym:[8,10,12,16,20,30,32]},
 {t:(x1,y1,x2)=>`Een fabriek verpakt ${y1} dozen in ${x1} uur. Hoeveel dozen verpakt ze in ${x2} uur (constant tempo)?`,xu:'uur',yu:'dozen',g:[1,1,2],ym:[25,40,50,60,75]},
 {t:(x1,y1,x2)=>`Een trein legt ${y1} km af in ${x1} uur. Hoeveel km legt hij af in ${x2} uur (constante snelheid)?`,xu:'uur',yu:'km',g:[1,1,2],ym:[60,80,90,120]},
 {t:(x1,y1,x2)=>`Een kraan levert ${y1} liter water per ${x1} minuten. Hoeveel liter levert ze in ${x2} minuten?`,xu:'min',yu:'liter',g:[1,1,5],ym:[12,15,20,25]},
 {t:(x1,y1,x2)=>`Een groep van ${x1} leerlingen verzamelt €${y1} voor een goed doel. Hoeveel euro verzamelen ${x2} leerlingen aan hetzelfde tempo?`,xu:'leerlingen',yu:'euro',g:[1,1,2],ym:[6,8,10,12,15]},
 {t:(x1,y1,x2)=>`Voor een muur van ${x1} m² heb je ${y1} stenen nodig. Hoeveel stenen heb je nodig voor ${x2} m²?`,xu:'m²',yu:'stenen',g:[1,1,3],ym:[30,35,40,50]}];
const OMG=[
 {t:(x1,y1,x2)=>`${x1} machines vullen samen een bestelling in ${y1} uur. Hoeveel uur hebben ${x2} machines nodig?`,xu:'machines',yu:'uur'},
 {t:(x1,y1,x2)=>`${x1} schilders schilderen een gebouw in ${y1} dagen. Hoeveel dagen hebben ${x2} schilders nodig?`,xu:'schilders',yu:'dagen'},
 {t:(x1,y1,x2)=>`Een tank wordt met ${x1} identieke pompen leeggepompt in ${y1} uur. Hoeveel uur duurt het met ${x2} pompen?`,xu:'pompen',yu:'uur'},
 {t:(x1,y1,x2)=>`${x1} arbeiders bouwen een brug in ${y1} dagen. Hoeveel dagen hebben ${x2} arbeiders nodig?`,xu:'arbeiders',yu:'dagen'},
 {t:(x1,y1,x2)=>`${x1} vrijwilligers pakken in ${y1} uur alle pakjes in. Hoeveel uur hebben ${x2} vrijwilligers nodig?`,xu:'vrijwilligers',yu:'uur'},
 {t:(x1,y1,x2)=>`Bij een snelheid van ${x1} km/u doet een fietser een tocht in ${y1} uur. Hoeveel uur doet hij erover bij ${x2} km/u?`,xu:'km/u',yu:'uur',sp:true}];
function ratioTable(rows){return `<div class="tbl-wrap"><table class="tbl rt">${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`}
function makeRecht(){const c=pick(RECHT);for(let g=0;g<200;g++){const gs=pick(c.g),ym=pick(c.ym);const m1=R(2,9),m2=R(2,12);if(m1===m2)continue;
    const x1=gs*m1,x2=gs*m2,y1=ym*m1,y2=ym*m2;if(x1>500||x2>500)continue;return {c,x1,x2,y1,y2,gs,ym,m1,m2}}}
function makeOmg(){const c=pick(OMG);for(let g=0;g<300;g++){const P=c.sp?pick([180,240,360,120,300]):pick([60,72,90,120,144,180,240,360]);const ds=[];for(let d=2;d<P;d++)if(P%d===0)ds.push(d);
    const pool=c.sp?ds.filter(d=>d>=10&&d<=120&&P/d<=24):ds.filter(d=>d<=30&&P/d<=60);if(pool.length<2)continue;const x1=pick(pool),x2=pick(pool);if(x1===x2)continue;return {c,x1,x2,y1:P/x1,y2:P/x2,P}}}
function genRecht(mode){const r=makeRecht();const {c,x1,x2,y1,y2,gs,ym,m1,m2}=r;
  const tb=ratioTable([[c.xu,x1,gs,x2],[c.yu,y1,ym,y2]]);
  const q=numQ(mode,{instr:'Recht evenredig. Gebruik de verhoudingstabel.',math:c.t(x1,y1,x2),v:y2,wrongs:[y1*x2,Math.round(y1*x1/x2)||y2+ym,y1+x2-x1],
    explain:`Hoe meer ${c.xu}, hoe meer ${c.yu}: recht evenredig.${tb}${x1} : ${m1} = ${gs} → ${y1} : ${m1} = ${ym}<br>${gs} ${D} ${m2} = ${x2} → ${ym} ${D} ${m2} = ${fin(y2)} ${c.yu}`,unit:c.yu});q.wordy=true;return q}
function genOmg(mode){const o=makeOmg();const {c,x1,x2,y1,y2,P}=o;
  const q=numQ(mode,{instr:'Omgekeerd evenredig. Het product blijft gelijk.',math:c.t(x1,y1,x2),v:y2,wrongs:[y1*x2/x1,y1+x1-x2,Math.round(y1*x2/x1)],
    explain:`Meer ${c.xu} → minder ${c.yu}: omgekeerd evenredig.<br>Totaal werk: ${x1} ${D} ${y1} = ${P}<br>${P} : ${x2} = ${fin(y2)} ${c.yu}`,unit:c.yu});q.wordy=true;return q}
function genKind(){const rec=Math.random()<.5;const o=rec?makeRecht():makeOmg();const txt=o.c.t(o.x1,o.y1,o.x2);
  return {instr:'Is dit verband recht of omgekeerd evenredig?',math:txt,wordy:true,layout:'words',options:[{label:'recht evenredig',correct:rec},{label:'omgekeerd evenredig',correct:!rec}],answerLabel:rec?'recht evenredig':'omgekeerd evenredig',
    explain:rec?`Dubbel zoveel ${o.c.xu} geeft dubbel zoveel ${o.c.yu}: ${fin('recht evenredig')}.`:`Dubbel zoveel ${o.c.xu} geeft maar de helft van ${o.c.yu}: ${fin('omgekeerd evenredig')}. Het product ${o.x1} ${D} ${o.y1} blijft gelijk.`}}

/* ===== zalen ===== */
const ROOMS=[
 {id:'A',name:'Zaal der Bewerkingen',topic:'Bewerkingen en volgorde',guard:'De oude rekenmachine',
  story:'Een stoffige rekenmachine van koper bewaakt het eerste slot. Hij geeft pas een cijfer prijs als je de bewerkingen in de juiste volgorde uitvoert.',
  tip:'1. haakjes &nbsp;2. machten, wortels, log &nbsp;3. · en : van links naar rechts &nbsp;4. + en − van links naar rechts.<br>√49 = 7 want 7² = 49 &nbsp;·&nbsp; ∛64 = 4 want 4³ = 64 &nbsp;·&nbsp; log₂ 8 = 3 want 2³ = 8',
  plan:()=>[genOps,genOps,genOps,genOps,genOps,genOps]},
 {id:'B',name:'De Lettergalerij',topic:'Eentermen en veeltermen',guard:'De schilderijen',
  story:'In deze galerij hangen schilderijen vol letters. Achter elk schilderij zit een cijfer, maar enkel wie de letters juist samenneemt, mag kijken.',
  tip:'Neem enkel gelijksoortige termen samen: 3a + 5a = 8a, maar 2a + 3b blijft staan.<br>a·5a = 5a² is geen a-term. &nbsp; 3·(a + b) = 3a + 3b.<br>Getalwaarde: vervang elke letter door haar getal.',
  plan:()=>[genSimpN,genSimpN,genGWN,genSimpN,genGWN,genSimpCalc]},
 {id:'C',name:'De Gang van de Getallenas',topic:'Getallenas en ordenen',guard:'De meetlat',
  story:'Een lange gang met een meetlat op de vloer. De tegels gaan pas open als je de getallen op de juiste plaats zet.',
  tip:'Het grootste getal ligt rechts. Reken eerst uit, vergelijk daarna.<br>≤ : het getal hoort erbij &nbsp;·&nbsp; < : het getal hoort er niet bij.<br>ℕ = {0, 1, 2, 3, …}',
  plan:()=>[genCmpN,genCmpN,genPlace,genSet,genPlace,genSet]},
 {id:'D',name:'De Procentenkelder',topic:'Procentrekenen',guard:'De kassa',
  story:'In de kelder staat een oude kassa met een prijskaartje aan elke lade. Alleen de juiste bedragen openen de lades.',
  tip:'10% = een tiende &nbsp;·&nbsp; 25% = een vierde &nbsp;·&nbsp; 50% = de helft &nbsp;·&nbsp; 1% = een honderdste.<br>Korting: trek het percentage af van de prijs. Stijging: tel het erbij.',
  plan:()=>[genPct,genPct,genPct,genPctWord,genPctWord,genPctWord]},
 {id:'E',name:'De Verhoudingentoren',topic:'Evenredigheden',guard:'Het uurwerk',
  story:'Boven in de toren tikt een reusachtig uurwerk. De wijzers geven het laatste cijfer pas vrij als je de verhoudingen doorziet.',
  tip:'Recht evenredig: dubbel zoveel → dubbel zoveel. Werk via de eenheid in een verhoudingstabel.<br>Omgekeerd evenredig: dubbel zoveel → de helft. Het product blijft gelijk: 6 machines · 20 uur = 120 = 15 · 8.',
  plan:()=>[genKind,genKind,genRecht,genOmg,genRecht,genOmg]},
 {id:'K',name:'De Hoofdkluis',topic:'Alles door elkaar',guard:'De kluis',
  story:'Je staat voor de grote kluisdeur. Ze vraagt van elke zaal nog één laatste bewijs. Kraak haar en je bent vrij!',
  tip:'Alles uit de vorige zalen komt terug. Werk rustig en noteer je tussenstappen op papier.',
  plan:()=>shuffle([genOps,genGWN,genSet,genPctWord,pick([genRecht,genOmg]),genSimpN])}
];
function makePuzzles(r){return r.plan().map((g,i)=>{const mode=i<2?'mc':'type';const q=g(mode);q.mode=q.options?'mc':mode;return q})}
function checkNum(q,raw){raw=String(raw||'').trim();if(!raw)return {status:'empty',msg:'Typ eerst een getal.'};if(!/^\d+$/.test(raw))return {status:'format',msg:'Typ enkel cijfers.'};return {status:+raw===q.value?'ok':'wrong'}}
if(typeof module!=='undefined'&&module.exports)module.exports={ROOMS,makePuzzles,checkNum,fmtPoly,parsePoly};
</script>
<script>
(function(){
const KEY='codekraker-n-v1';
let S={name:'',rooms:{},all:false};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MAIN=ROOMS.filter(r=>r.id!=='K'),VAULT=ROOMS.find(r=>r.id==='K');
const done=id=>!!(S.rooms[id]&&S.rooms[id].stars);
const open=r=>S.all||r.id==='A'||(r.id==='K'?MAIN.every(x=>done(x.id)):done(MAIN[MAIN.indexOf(r)-1].id))||done(r.id);
const starPath='M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z';
const star=(on,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="${starPath}" fill="${on?'var(--brass)':'none'}" stroke="${on?'var(--brass)':'var(--lock)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const stars=(n,s)=>`<span style="display:inline-flex;gap:2px" aria-label="${n} van 3 sterren">${[0,1,2].map(i=>star(i<n,s)).join('')}</span>`;
const fmtT=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const lockIcon=`<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>`;
const totalStars=()=>ROOMS.reduce((s,r)=>s+(S.rooms[r.id]?.stars||0),0);

function topBar(){return `<div class="bar"><h2>${esc(S.name)}</h2><div class="chips"><span class="chip">${star(true,16)} ${totalStars()}/18</span><span class="chip">${lockIcon} ${ROOMS.filter(r=>done(r.id)).length}/6 sloten</span></div></div>`}

/* ---------- start ---------- */
function startScreen(){
  app.innerHTML=`<section class="panel" style="display:grid;gap:16px">
   <p class="eyebrow">Wiskunde 7VJHO · Herhaling natuurlijke getallen</p>
   <h1 class="title"><small>ESCAPE ROOM</small>Codekraker ℕ</h1>
   <p class="story">Tijdens de uitstap naar het Rekenmuseum ben je even blijven hangen. Plots gaan de lichten uit en vallen alle deuren in het slot. Elke zaal heeft een cijferslot dat alleen opengaat voor wie de rekenraadsels oplost. Kraak de vijf zalen, verzamel hun sleutelcijfers en open de hoofdkluis om te ontsnappen.</p>
   ${S.name?`<div class="row"><button class="btn" id="cont">Verder als ${esc(S.name)}</button><button class="btn ghost" id="new">Nieuwe speler</button></div>`:form()}
  </section>
  <section class="panel"><p class="eyebrow">Spelregels</p>
   <ul class="soft" style="margin:8px 0 0;padding-left:20px;display:grid;gap:4px">
    <li>Elke zaal heeft 6 raadsels. Elk opgelost raadsel draait een cijfer van het slot open.</li>
    <li>Fout? Je mag nog één keer proberen, maar de klok krijgt 20 seconden straf. Lukt het de tweede keer niet, dan zie je de uitwerking.</li>
    <li>Een tip vragen kan altijd, voor 20 seconden straf.</li>
    <li>Minder fouten = meer sterren. Je beste tijd per zaal wordt bijgehouden.</li>
   </ul></section>`;
  const c=document.getElementById('cont');if(c){c.onclick=planScreen;document.getElementById('new').onclick=()=>{c.parentElement.outerHTML=form();bind()}}else bind();
}
function form(){return `<form id="nf" class="row" autocomplete="off" style="align-items:flex-end"><div class="field" style="flex:1 1 220px"><label for="nm" style="font-weight:600">Hoe heet je?</label><input id="nm" maxlength="20" placeholder="Je voornaam" required></div><button class="btn" type="submit">Start de ontsnapping</button></form>`}
function bind(){const f=document.getElementById('nf');f.onsubmit=e=>{e.preventDefault();const n=document.getElementById('nm').value.trim();if(!n)return;if(n!==S.name){S.rooms={}}S.name=n;save();planScreen()}}

/* ---------- plattegrond ---------- */
function planScreen(){window.scrollTo(0,0);
  const allMain=MAIN.every(r=>done(r.id));
  app.innerHTML=`${topBar()}
  <section class="plan"><div class="plan-head"><span>Plattegrond Rekenmuseum</span><span>schaal 1 : 100</span></div>
   <div class="rooms">${MAIN.map(r=>{const o=open(r),d=done(r.id),R_=S.rooms[r.id]||{};
     return `<button class="room${d?' done':''}" data-id="${r.id}" ${o?'':'disabled'}><span class="let">${r.id}</span><b>${r.name}</b><span class="tp">${r.topic}</span>
      <span class="st">${d?`${stars(R_.stars)}<span class="soft" style="font-size:.8rem">${fmtT(R_.best)}</span><span class="digit" title="Sleutelcijfer">${R_.digit}</span>`:`<span class="soft" style="display:inline-flex;gap:6px;align-items:center;font-size:.85rem">${lockIcon} ${o?'open':'op slot'}</span><span class="digit">?</span>`}</span></button>`}).join('')}
    <button class="room vault${done('K')?' done':''}" data-id="K" ${open(VAULT)?'':'disabled'}>
     <span class="let" style="font-size:3rem">⌾</span>
     <span style="display:grid;gap:6px;min-width:0"><b>${VAULT.name}</b><span class="tp">${allMain||S.all?'Gebruik de sleutelcijfers van zaal A tot E.':'Verzamel eerst de vijf sleutelcijfers.'}</span>
      <span class="codes">${MAIN.map(r=>`<span class="digit">${done(r.id)?S.rooms[r.id].digit:'?'}</span>`).join('')}${done('K')?stars(S.rooms.K.stars):''}</span></span></button>
   </div></section>
  <details class="teacher panel"><summary>Voor de leerkracht</summary><div class="inner">
   <label class="row"><input type="checkbox" id="allz" ${S.all?'checked':''}> Alle zalen openzetten (vrij oefenen per onderdeel)</label>
   <div class="row"><button class="btn ghost small" id="reset">Voortgang wissen</button><span id="rc"></span></div>
   <p>De zalen volgen de onderdelen A tot E van de herhalingsbundel. Alle raadsels worden telkens willekeurig gemaakt. De voortgang blijft enkel op dit toestel bewaard.</p></div></details>`;
  app.querySelectorAll('.room').forEach(b=>b.onclick=()=>{const r=ROOMS.find(x=>x.id===b.dataset.id);if(!open(r))return;r.id==='K'&&!S.all&&!done('K')?codeScreen():introScreen(r)});
  document.getElementById('allz').onchange=e=>{S.all=e.target.checked;save();planScreen()};
  document.getElementById('reset').onclick=()=>{document.getElementById('rc').innerHTML='<button class="btn small" id="rc2">Ja, alles wissen</button>';document.getElementById('rc2').onclick=()=>{S.rooms={};save();planScreen()}};
}
/* ---------- code van de kluis ---------- */
function codeScreen(){window.scrollTo(0,0);const code=MAIN.map(r=>S.rooms[r.id].digit).join('');let val='';
  app.innerHTML=`${topBar()}<section class="panel qcard"><p class="eyebrow">De Hoofdkluis</p><h2 style="font-size:2.2rem">Voer de code in</h2>
   <p class="soft">De code bestaat uit de vijf sleutelcijfers die je vond, in de volgorde van zaal A tot E. Kijk op de plattegrond als je ze vergeten bent.</p>
   <div class="pad"><div class="screen" id="scr"></div>${keypad()}</div><p class="warn" id="warn" hidden></p>
   <div class="row"><button class="btn ghost small" id="back">Terug naar de plattegrond</button></div></section>`;
  const scr=document.getElementById('scr'),warn=document.getElementById('warn');
  const draw=()=>scr.innerHTML=(val.padEnd(5,'·'))+'';draw();
  const submit=()=>{if(val.length<5){warn.hidden=false;warn.textContent='De code heeft 5 cijfers.';return}if(val===code)introScreen(VAULT);else{warn.hidden=false;warn.textContent='De kluis blijft dicht. Controleer de sleutelcijfers op de plattegrond.';val='';draw()}};
  bindPad(k=>{if(k==='del')val=val.slice(0,-1);else if(k==='ok')return submit();else if(val.length<5)val+=k;warn.hidden=true;draw()});
  document.getElementById('back').onclick=planScreen;
}
/* ---------- zaal-intro ---------- */
function introScreen(r){window.scrollTo(0,0);
  app.innerHTML=`${topBar()}<section class="panel" style="display:grid;gap:16px">
   <p class="eyebrow">Zaal ${r.id==='K'?'K':r.id} · ${r.topic}</p><h2 style="font-size:2.6rem">${r.name}</h2>
   <p class="story">${r.story}</p>
   <div class="tipbox"><h3>Spiekbriefje</h3><p>${r.tip}</p></div>
   ${S.rooms[r.id]?.best?`<p class="soft">Je beste tijd hier: ${fmtT(S.rooms[r.id].best)}. Kun je sneller?</p>`:''}
   <div class="row"><button class="btn" id="go">Kraak het slot</button><button class="btn ghost" id="back">Terug</button></div></section>`;
  document.getElementById('go').onclick=()=>startRoom(r);document.getElementById('back').onclick=planScreen;document.getElementById('go').focus();
}
/* ---------- spel ---------- */
let G=null,tick=null;
function startRoom(r){clearInterval(tick);G={r,qs:makePuzzles(r),i:0,mist:0,pen:0,t0:Date.now(),dials:[],tries:0};
  tick=setInterval(()=>{const el=document.getElementById('clock');if(el)el.textContent=fmtT(elapsed())},500);renderQ()}
const elapsed=()=>(Date.now()-G.t0)/1000+G.pen;
function lockHTML(){return `<div class="lockwrap"><button class="btn ghost small" id="quit">← Plattegrond</button>
  <div class="dials" aria-label="Slot: ${G.dials.length} van 6 cijfers open">${G.qs.map((q,i)=>{const d=G.dials[i];return `<span class="dial${d?(d.ok?' on':' bad'):''}${d&&d.fresh?' spin':''}"><span>${d?d.n:'·'}</span></span>`}).join('')}</div>
  <div class="chips"><span class="chip" title="Tijd">⏱ <span id="clock">${fmtT(elapsed())}</span></span><span class="chip" title="Fouten">✗ ${G.mist}</span></div></div>`}
function keypad(){return `<div class="keys">${['1','2','3','4','5','6','7','8','9'].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}<button type="button" data-k="del" aria-label="Wissen">⌫</button><button type="button" data-k="0">0</button><button type="button" class="ok" data-k="ok">OK</button></div>`}
let padKey=null;
function bindPad(fn){app.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>fn(b.dataset.k));padKey=fn}
document.addEventListener('keydown',e=>{if(!padKey||!document.querySelector('.keys'))return;if(e.target.tagName==='INPUT')return;
  if(/^\d$/.test(e.key)){padKey(e.key);e.preventDefault()}else if(e.key==='Backspace'){padKey('del');e.preventDefault()}else if(e.key==='Enter'&&!document.getElementById('next')){padKey('ok');e.preventDefault()}});
function renderQ(){window.scrollTo({top:0});padKey=null;
  const q=G.qs[G.i],r=G.r;G.tries=0;G.dials.forEach(d=>d.fresh=false);let ans='';
  if(q.options)ans=`<div class="opts ${q.layout||''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.label}</button>`).join('')}</div>`;
  else if(q.kind==='num')ans=`<div class="pad"><div class="screen" id="scr"></div>${keypad()}</div><p class="warn" id="warn" hidden></p>`;
  else if(q.kind==='place')ans=`<div class="nlbox">${nlSVG(false)}</div><p class="hint">Klik op het juiste streepje.</p>`;
  else if(q.kind==='set')ans=`<div class="nlbox">${nlSVG(true)}</div><div class="row" style="justify-content:space-between"><p class="hint">Klik op elk getal dat voldoet. Nog eens klikken = weghalen.</p><button class="btn" id="chk">Controleer</button></div><p class="warn" id="warn" hidden></p>`;
  app.innerHTML=`${lockHTML()}<section class="panel qcard">
   <div class="row" style="justify-content:space-between"><span class="eyebrow">${r.name} · raadsel ${G.i+1} van 6</span><button class="btn ghost small" id="tip">Tip (+20 s)</button></div>
   <p class="instr">${q.instr}</p><div class="math${q.wordy?' wordy':''}">${q.math}</div>
   <div id="tipbox"></div>${ans}<div id="fb"></div></section>`;
  document.getElementById('quit').onclick=()=>{clearInterval(tick);planScreen()};
  document.getElementById('tip').onclick=e=>{G.pen+=20;e.target.disabled=true;document.getElementById('tipbox').innerHTML=`<div class="tipbox"><h3>Spiekbriefje</h3><p>${r.tip}</p></div>`;refreshLock()};
  if(q.options)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.i];if(o.correct){app.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('right');solved(true)}else{b.classList.add('wrong');b.disabled=true;miss(()=>{app.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(q.options[i].correct)x.classList.add('right')})})}});
  else if(q.kind==='num'){let val='';const scr=document.getElementById('scr'),warn=document.getElementById('warn');
    const draw=()=>scr.innerHTML=`<span>${val||''}</span><span class="cur"></span>${q.unit?`<span class="unit">${q.unit}</span>`:''}`;draw();
    bindPad(k=>{if(document.getElementById('next'))return;warn.hidden=true;if(k==='del')val=val.slice(0,-1);else if(k==='ok'){const c=checkNum(q,val);if(c.status==='empty'||c.status==='format'){warn.hidden=false;warn.textContent=c.msg;return}
        if(c.status==='ok'){padKey=null;solved(true)}else{val='';miss(()=>{padKey=null})}}else if(val.length<6)val+=k;draw()})}
  else if(q.kind==='place')bindPlace(q);
  else if(q.kind==='set')bindSet(q);
}
function refreshLock(){const l=app.querySelector('.lockwrap');if(l){l.outerHTML=lockHTML();document.getElementById('quit').onclick=()=>{clearInterval(tick);planScreen()}}}
function miss(onReveal){G.mist++;G.tries++;G.pen+=20;const q=G.qs[G.i];const fb=document.getElementById('fb');
  if(G.tries<2){fb.innerHTML=`<div class="fb no"><h3>Nog niet juist</h3><p>+20 seconden. Kijk je berekening na en probeer nog een keer.</p></div>`;refreshLock();return}
  onReveal&&onReveal();finish(false)}
function solved(ok){finish(ok)}
function finish(ok){const q=G.qs[G.i];const n=R(0,9);G.dials[G.i]={n,ok,fresh:true};const last=G.i===G.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?pick(['Klik! Juist.','Het slot draait.','Juist!','Prima gekraakt!']):'Helaas'}</h3>
   ${ok?'':`<p>Het juiste antwoord is <b>${q.answerLabel}</b>.</p>`}<div>${q.explain}</div>
   <div class="row"><button class="btn" id="next">${last?'Open het slot':'Volgend raadsel'}</button></div></div>`;
  app.querySelectorAll('#tip').forEach(b=>b.disabled=true);refreshLock();
  const nx=document.getElementById('next');nx.focus({preventScroll:true});document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  nx.onclick=()=>{if(last)return roomDone();G.i++;renderQ()}}
function roomDone(){clearInterval(tick);const r=G.r,t=Math.round(elapsed());const st=G.mist===0?3:G.mist<=2?2:1;const prev=S.rooms[r.id];
  const digit=prev?.digit??R(0,9);S.rooms[r.id]={stars:Math.max(prev?.stars||0,st),best:Math.min(prev?.best||Infinity,t),digit};save();
  const isVault=r.id==='K';const next=MAIN[MAIN.indexOf(r)+1];
  app.innerHTML=`${topBar()}<section class="panel result"><p class="eyebrow">${r.name}</p>
   <h2>${isVault?'De kluis is open!':'Slot gekraakt!'}</h2>
   ${isVault?`<p class="story">De zware deur zwaait open en de nachtwaker kijkt verbaasd op. “Hoe ben jij hier binnengeraakt?” Je bent ontsnapt, ${esc(S.name)}!</p>`:`<p>Achter het slot ligt een kaartje met het sleutelcijfer van deze zaal. Onthoud het goed!</p><div class="bigdigit pop">${digit}</div>`}
   ${stars(st,40)}
   <p>Tijd: <b>${fmtT(t)}</b> (strafseconden inbegrepen) · Fouten: <b>${G.mist}</b>${prev?.best&&t<prev.best?' · Nieuw record!':''}</p>
   <div class="row" style="justify-content:center">${!isVault&&next&&!done(next.id)?`<button class="btn" id="nz">Naar ${next.name}</button>`:''}${!isVault&&!next&&!done('K')?`<button class="btn" id="vk">Naar de hoofdkluis</button>`:''}<button class="btn ghost" id="pl">Plattegrond</button><button class="btn ghost" id="ag">Opnieuw (sneller?)</button></div></section>`;
  const nz=document.getElementById('nz');if(nz)nz.onclick=()=>introScreen(next);
  const vk=document.getElementById('vk');if(vk)vk.onclick=()=>open(VAULT)?(S.all?introScreen(VAULT):codeScreen()):planScreen();
  document.getElementById('pl').onclick=planScreen;document.getElementById('ag').onclick=()=>startRoom(r);
}
/* ---------- getallenas 0..20 ---------- */
const NX=n=>26+n*28.4;
function nlSVG(multi){let s=`<svg viewBox="0 0 620 104" role="group" aria-label="Getallenas van 0 tot 20"><line x1="14" y1="50" x2="606" y2="50" stroke="var(--ink)" stroke-width="2"/><path d="M608 50 l-10 -5 v10z" fill="var(--ink)"/>`;
  for(let n=0;n<=20;n++){const x=NX(n);s+=`<line x1="${x}" y1="${n%5===0?32:39}" x2="${x}" y2="${n%5===0?68:61}" stroke="var(--ink)" stroke-width="${n%5===0?3:2}"/>${n%2===0?`<text x="${x}" y="92" text-anchor="middle" font-size="${n%10===0?27:23}" font-weight="${n%10===0?600:400}" fill="${n%10===0?'var(--ink)':'var(--ink-soft)'}" font-family="Lexend,sans-serif">${n}</text>`:''}`;
    s+=`<circle class="dot" data-n="${n}" cx="${x}" cy="50" r="12" fill="transparent" stroke="transparent" stroke-width="2"/><rect class="hit" data-n="${n}" x="${x-14}" y="6" width="28.4" height="90" fill="transparent" style="cursor:pointer"><title>${n}</title></rect>`}
  return s+'<g id="marks"></g></svg>'}
function bindPlace(q){const svg=app.querySelector('.nlbox svg');let busy=false;
  const mk=(v,col)=>`<g><path d="M${NX(v)},44 l-9,-16 h18z" fill="${col}"/><text x="${NX(v)}" y="22" text-anchor="middle" font-size="16" font-family="Big Shoulders Stencil Display,sans-serif" font-weight="800" fill="${col}">${q.letter}</text></g>`;
  svg.querySelectorAll('.hit').forEach(h=>h.addEventListener('click',()=>{if(busy||document.getElementById('next'))return;const n=+h.dataset.n;
    if(n===q.value){svg.querySelector('#marks').innerHTML=mk(n,'var(--ok)');busy=true;solved(true)}
    else{svg.querySelector('#marks').innerHTML=mk(n,'var(--no)');miss(()=>{busy=true;svg.querySelector('#marks').innerHTML=mk(n,'var(--no)')+mk(q.value,'var(--ok)')})}}))}
function bindSet(q){const svg=app.querySelector('.nlbox svg');const sel=new Set();const warn=document.getElementById('warn');
  const paint=()=>svg.querySelectorAll('.dot').forEach(d=>{const n=+d.dataset.n;d.setAttribute('fill',sel.has(n)?'var(--brass)':'transparent');d.setAttribute('stroke',sel.has(n)?'var(--brass-deep)':'transparent')});
  svg.querySelectorAll('.hit').forEach(h=>h.addEventListener('click',()=>{if(document.getElementById('next'))return;const n=+h.dataset.n;sel.has(n)?sel.delete(n):sel.add(n);warn.hidden=true;paint()}));
  document.getElementById('chk').onclick=()=>{if(document.getElementById('next'))return;if(!sel.size){warn.hidden=false;warn.textContent='Duid eerst getallen aan.';return}
    const ok=sel.size===q.value.length&&q.value.every(x=>sel.has(x));
    if(ok){document.getElementById('chk').disabled=true;solved(true)}else miss(()=>{document.getElementById('chk').disabled=true;sel.clear();q.value.forEach(x=>sel.add(x));paint()})}}

startScreen();
})();
</script>
