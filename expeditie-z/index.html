<title>Expeditie ℤ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: één kolom (max 760px) — kaart als zeekaart van een eiland, opdrachten als kaartjes die erop "uitklappen" */
:root{
  --bg:#e4f1f2; --sea:#cfe7e9; --sea-line:#a9d3d7; --sand:#f0dca8; --sand-edge:#d7bd7b; --grass:#b4d495; --hill:#9cc47c;
  --card:#ffffff; --ink:#15314a; --ink-soft:#4e6879; --line:#d5e2e6;
  --accent:#f2a516; --accent-ink:#5a3a00; --pos:#2b8f5c; --pos-bg:#e3f4ea; --neg:#cf4a3f; --neg-bg:#fbe7e4; --lock:#9fb0b8; --halo:#fdf6e3;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1d29; --sea:#10293a; --sea-line:#1b3d52; --sand:#bfa871; --sand-edge:#9b864f; --grass:#5f8c4d; --hill:#517a40;
  --card:#142a3b; --ink:#e5f0f4; --ink-soft:#9fb7c4; --line:#24435a;
  --accent:#ffb733; --accent-ink:#3a2500; --pos:#4cc489; --pos-bg:#143a2b; --neg:#ff7b6e; --neg-bg:#41201f; --lock:#4d6574; --halo:#0f2230; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1d29; --sea:#10293a; --sea-line:#1b3d52; --sand:#bfa871; --sand-edge:#9b864f; --grass:#5f8c4d; --hill:#517a40;
  --card:#142a3b; --ink:#e5f0f4; --ink-soft:#9fb7c4; --line:#24435a;
  --accent:#ffb733; --accent-ink:#3a2500; --pos:#4cc489; --pos-bg:#143a2b; --neg:#ff7b6e; --neg-bg:#41201f; --lock:#4d6574; --halo:#0f2230; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line)}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* start */
.hero{display:grid;gap:14px}
.hero h1{font-size:clamp(2.6rem,9vw,4.2rem);color:var(--ink)}
.hero h1 .z{color:var(--accent)}
.story{color:var(--ink-soft);max-width:60ch}
.field{display:grid;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);max-width:340px;width:100%}
.colors{display:flex;gap:10px}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bar .who{display:flex;align-items:center;gap:10px;min-width:0}
.bar .who h2{font-size:1.4rem}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.compass svg{display:block}

/* kaart */
.map-wrap{background:var(--sea);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.map-wrap svg{display:block;width:100%;height:auto;max-height:78vh}
.node{cursor:pointer}
.node.locked{cursor:not-allowed}
.node .ring{transition:transform .2s}
.node:hover .ring,.node:focus .ring{transform:scale(1.12)}
.node:focus{outline:none}
.node:focus-visible .ring{stroke:var(--accent);stroke-width:4}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.zlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.zitem{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.zitem:disabled{opacity:.55;cursor:not-allowed}
.znum{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);background:var(--sea);color:var(--ink)}
.zitem.done .znum{background:var(--accent);color:var(--accent-ink)}
.zitem .t{min-width:0}
.zitem .t b{display:block;font-size:.95rem}
.zitem .t span{display:block;font-size:.82rem;color:var(--ink-soft)}
.alt{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:700}
.alt.up{color:var(--pos)} .alt.down{color:var(--neg)}
.teacher{font-size:.9rem;color:var(--ink-soft)}
.teacher summary{cursor:pointer;font-weight:700}
.teacher .inner{display:grid;gap:10px;padding-top:10px}

/* zone-intro */
.guardian{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:none;width:64px;height:64px;border-radius:50%;background:var(--sea);display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;color:var(--ink)}
.bubble{position:relative;background:var(--bg);border-radius:12px;padding:12px 14px;min-width:0}
.tipbox{border-left:4px solid var(--accent);padding:10px 14px;background:color-mix(in srgb,var(--accent) 10%,var(--card));border-radius:0 10px 10px 0}
.tipbox h3{font-size:1.05rem;margin-bottom:4px}

/* spel */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud .btn{padding:8px 14px}
.qcard>*,.typein,.typein>*{min-width:0}
.hearts{display:flex;gap:4px}
.dots{display:flex;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.dots i.ok{background:var(--pos)} .dots i.no{background:var(--neg)} .dots i.cur{box-shadow:0 0 0 3px var(--accent)}
.qcard{display:grid;gap:16px}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.instr{font-weight:700}
.math{font-size:clamp(1.6rem,6vw,2.3rem);font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.math.small{font-size:1.15rem;font-weight:700}
.blank{display:inline-block;min-width:1.6em;text-align:center;border-bottom:3px solid var(--accent);color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.cmp{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.words{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:14px 10px;font-size:1.3rem;font-variant-numeric:tabular-nums;font-weight:700;min-width:0;overflow-wrap:anywhere}
.opts.cmp .opt{font-size:2rem;padding:8px}
.opts.words .opt{font-size:1.05rem;text-align:left;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--pos);background:var(--pos-bg)}
.opt.wrong{border-color:var(--neg);background:var(--neg-bg)}
.opt:disabled{cursor:default}
.typein{display:grid;gap:10px}
.typein .line{display:flex;gap:10px;flex-wrap:wrap}
.typein input{flex:1 1 200px;min-width:0;font:inherit;font-size:1.4rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:1.05rem}
.hint{font-size:.88rem;color:var(--ink-soft)}
.warn{font-size:.95rem;color:var(--neg);font-weight:700}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--pos-bg)} .fb.no{background:var(--neg-bg)}
.fb h3{font-size:1.3rem}
.fb.ok h3{color:var(--pos)} .fb.no h3{color:var(--neg)}
.fb .st{display:block;font-variant-numeric:tabular-nums}
.fb .row{justify-content:flex-end}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
.tbl th{text-align:left;background:var(--bg);font-size:.9rem}
.tb-blank{background:color-mix(in srgb,var(--accent) 25%,transparent);font-weight:700}
.svgbox{max-width:420px;width:100%;margin:0 auto}
.svgbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.nlbox{overflow-x:auto}
.nlbox svg{display:block;width:100%;min-width:520px;height:auto}
.gtxt{fill:var(--ink-soft);font-family:var(--f-body);font-size:11px}
.result{display:grid;gap:14px;text-align:center;justify-items:center}
.result h2{font-size:2rem}
.bigstars{display:flex;gap:8px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media (max-width:480px){body{font-size:16px}.hearts svg{width:20px;height:20px}.card{padding:16px}.opt{font-size:1.15rem}}
</style>
<div id="app" aria-live="polite"></div>
<script>/* ===== Expeditie ℤ — logica: hulpfuncties, veeltermen, generatoren ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const nz=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const nzx=(a,b,ex)=>{let v;do{v=R(a,b)}while(v===0||ex.includes(v));return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MIN='−';
const f=n=>n<0?MIN+(-n):String(n);
const p=n=>n<0?'('+f(n)+')':f(n);
const SUPC={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const SUBC={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sup=n=>String(n).split('').map(c=>SUPC[c]||c).join('');
const sub=n=>String(n).split('').map(c=>SUBC[c]||c).join('');
const isInt=x=>Number.isInteger(x);

/* ---------- veeltermen ---------- */
function vexp(k){const m={};for(const x of k.matchAll(/([a-z])(\d+)/g))m[x[1]]=(m[x[1]]||0)+ +x[2];return m}
function vkey(m){return Object.keys(m).filter(v=>m[v]!==0).sort().map(v=>v+m[v]).join('')}
function clean(a){const r={};for(const k in a)if(Math.abs(a[k])>1e-9)r[k]=a[k];return r}
function padd(a,b){const r={...a};for(const k in b)r[k]=(r[k]||0)+b[k];return clean(r)}
function pneg(a){const r={};for(const k in a)r[k]=-a[k];return r}
function pmul(a,b){const r={};for(const ka in a)for(const kb in b){const m=vexp(ka),n=vexp(kb);for(const v in n)m[v]=(m[v]||0)+n[v];const k=vkey(m);r[k]=(r[k]||0)+a[ka]*b[kb]}return clean(r)}
function pdiv(a,b){const ks=Object.keys(b);if(ks.length!==1)throw new Error('deling');const kb=ks[0],cb=b[kb];const r={};for(const ka in a){const m=vexp(ka),n=vexp(kb);for(const v in n){m[v]=(m[v]||0)-n[v];if(m[v]<0)throw new Error('deling')}const k=vkey(m);r[k]=(r[k]||0)+a[ka]/cb}return clean(r)}
function ppow(a,n){if(!isInt(n)||n<0||n>20)throw new Error('exp');let r={'':1};for(let i=0;i<n;i++)r=pmul(r,a);return r}
function pequal(a,b){const d=padd(a,pneg(b));return Object.keys(d).length===0}
function pconst(a){const ks=Object.keys(a);if(ks.length===0)return 0;if(ks.length===1&&ks[0]==='')return a[''];return null}

function normalize(s){
  s=String(s).toLowerCase().replace(/[−–—]/g,'-').replace(/[·×∙•*⋅]/g,'*').replace(/[:÷\/]/g,'/');
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>Object.keys(SUPC).find(k=>SUPC[k]===c)).join(''));
  return s.replace(/\s+/g,'');
}
function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];
  if(/\d/.test(c)){let j=i;while(j<s.length&&/[\d.]/.test(s[j]))j++;t.push({t:'n',v:parseFloat(s.slice(i,j))});i=j}
  else if(/[a-z]/.test(c)){t.push({t:'v',v:c});i++}
  else if('+-*/^()'.includes(c)){t.push({t:c});i++}
  else throw new Error('teken')}return t}
function parsePoly(str){
  const t=tokenize(normalize(str));if(!t.length)throw new Error('leeg');let i=0;
  const pk=()=>t[i];
  function expr(){let r=term();while(pk()&&(pk().t==='+'||pk().t==='-')){const op=t[i++].t;const b=term();r=op==='+'?padd(r,b):padd(r,pneg(b))}return r}
  function term(){let r=factor();for(;;){const n=pk();if(!n)break;
    if(n.t==='*'){i++;r=pmul(r,factor())}
    else if(n.t==='/'){i++;r=pdiv(r,factor())}
    else if(n.t==='v'||n.t==='('){r=pmul(r,power())}
    else break}return r}
  function factor(){const n=pk();if(!n)throw new Error('einde');
    if(n.t==='-'){i++;return pneg(factor())}if(n.t==='+'){i++;return factor()}return power()}
  function power(){let b=atom();if(pk()&&pk().t==='^'){i++;let e;
      if(pk()&&pk().t==='n'){e=t[i++].v}
      else if(pk()&&pk().t==='('){i++;if(!pk()||pk().t!=='n')throw new Error('exp');e=t[i++].v;if(!pk()||pk().t!==')')throw new Error('exp');i++}
      else throw new Error('exp');
      b=ppow(b,e)}return b}
  function atom(){const n=t[i++];if(!n)throw new Error('einde');
    if(n.t==='n')return clean({'':n.v});
    if(n.t==='v')return {[n.v+'1']:1};
    if(n.t==='('){const r=expr();if(!pk()||pk().t!==')')throw new Error('haakje');i++;return r}
    throw new Error('syntax')}
  const r=expr();if(i!==t.length)throw new Error('rest');return r;
}
function isSimplified(raw,target){
  const s=normalize(raw);if(/[()\/]/.test(s))return false;
  const terms=s.replace(/^[+-]/,'').split(/[+-]/);
  if(terms.some(x=>x===''))return false;
  for(const x of terms){const y=x.replace(/\^\d+/g,'');const nums=y.match(/\d+(\.\d+)?/g)||[];const vars=y.match(/[a-z]/g)||[];
    if(nums.length>1)return false;if(new Set(vars).size!==vars.length)return false;if(/\^/.test(y))return false}
  const n=Math.max(1,Object.keys(target).length);
  return terms.length===n;
}
const VORDER=['a','b','x','y'];
function fmtNum(n){return isInt(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function fmtPoly(pl){
  const ks=Object.keys(pl);if(!ks.length)return '0';
  const deg=k=>Object.values(vexp(k)).reduce((s,e)=>s+e,0);
  ks.sort((x,y)=>{const d=deg(y)-deg(x);if(d)return d;const ex=vexp(x),ey=vexp(y);for(const v of VORDER){const c=(ey[v]||0)-(ex[v]||0);if(c)return c}return 0});
  return ks.map((k,i)=>{const c=pl[k],a=Math.abs(c);const m=vexp(k);
    const vars=Object.keys(m).sort().map(v=>v+(m[v]===1?'':sup(m[v]))).join('');
    const core=(a===1&&vars?'':fmtNum(a))+vars;
    return i===0?(c<0?MIN:'')+core:(c<0?' '+MIN+' ':' + ')+core}).join('');
}

/* ---------- meerkeuze ---------- */
function intOptions(v,wrongs,extra){
  const lab=x=>typeof x==='number'?f(x):x;
  const seen=new Set([lab(v)]);const o=[{label:lab(v),correct:true}];
  const add=w=>{if(o.length>=4)return;if(typeof w==='number'&&!isInt(w))return;const l=lab(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  (extra||[]).forEach(add);wrongs.forEach(add);
  let g=0;while(o.length<4&&g++<80){const base=typeof v==='number'?v:0;add(pick([-base,base+nz(-6,6),base+nz(-3,3),base*2]))}
  return shuffle(o);
}
function perturb(pl){const r={...pl};const ks=Object.keys(r);if(!ks.length)return {a1:1};const k=pick(ks);const t=R(0,2);
  if(t===0)r[k]=-r[k];else if(t===1){r[k]+=nz(-2,2)}else{const m=vexp(k);const v=Object.keys(m)[0];if(v){m[v]=m[v]+pick([1,-1]);const c=r[k];delete r[k];const nk=vkey(m);r[nk]=(r[nk]||0)+c}else r[k]=-r[k]}
  return clean(r)}
function exprOptions(target,wrongs){
  const seen=new Set([fmtPoly(target)]);const o=[{label:fmtPoly(target),correct:true}];
  const add=w=>{if(o.length>=4||!w)return;if(pequal(w,target))return;const l=fmtPoly(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  wrongs.forEach(w=>{try{add(typeof w==='string'?parsePoly(w):w)}catch(e){}});
  let g=0;while(o.length<4&&g++<80)add(perturb(target));
  return shuffle(o);
}
/* bouwt een vraag met getal-antwoord */
function intQ(mode,{instr,math,v,wrongs=[],explain,bn=false}){
  const q={instr,math,explain,answerLabel:v===null?'bestaat niet':f(v)};
  if(mode==='mc'){q.options=intOptions(v===null?'bestaat niet':v,wrongs,bn?['bestaat niet']:[])}
  else{q.kind=bn?'intbn':'int';q.value=v}
  return q}
function exprQ(mode,{instr,math,target,wrongs=[],explain,vars}){
  const q={instr,math,explain,answerLabel:fmtPoly(target),vars};
  if(mode==='mc')q.options=exprOptions(target,wrongs);else{q.kind='expr';q.target=target}
  return q}

/* ---------- uitleghulp ---------- */
function sumExplain(x,y){const v=x+y;
  if(x===0||y===0)return `Optellen met 0 verandert niets: ${f(v)}.`;
  if(x===-y)return `${f(x)} en ${f(y)} zijn tegengestelde getallen: hun som is 0.`;
  if(Math.sign(x)===Math.sign(y))return `${f(x)} en ${f(y)} hebben hetzelfde teken: tel ${Math.abs(x)} + ${Math.abs(y)} = ${Math.abs(v)} en behoud het teken → <b>${f(v)}</b>.`;
  const big=Math.abs(x)>Math.abs(y)?x:y,sm=big===x?y:x;
  return `Verschillend teken: ${Math.abs(big)} − ${Math.abs(sm)} = ${Math.abs(v)}. Neem het teken van ${f(big)} (grootste absolute waarde) → <b>${f(v)}</b>.`}
function signText(nNeg){return nNeg%2===0?`${nNeg===0?'geen':'een even aantal ('+nNeg+')'} mintekens → positief`:`een oneven aantal (${nNeg}) mintekens → negatief`}
const steps=(start,arr)=>`<span class="st">${start}</span>`+arr.map(s=>`<span class="st">= ${s}</span>`).join('');

/* ===== ZONE 1: optellen en aftrekken ===== */
function genAdd(mode){
  const a=nz(-20,20),b=nz(-15,15),minus=Math.random()<.55;
  const math=`${f(a)} ${minus?MIN:'+'} ${p(b)}`;const b2=minus?-b:b,v=a+b2;
  let ex='';if(minus)ex+=`Aftrekken = optellen met het tegengestelde: ${math} = ${f(a)} + ${p(-b)}.<br>`;
  ex+=sumExplain(a,b2);
  return intQ(mode,{instr:'Bereken.',math,v,wrongs:[a-b2,-v,(v<0?-1:1)*(Math.abs(a)+Math.abs(b2)),-a+b2],explain:ex});
}
/* ===== ZONE 2: vermenigvuldigen en delen ===== */
function genMul(mode){
  const t=R(0,4);
  if(t===0){const a=nzx(-12,12,[1,-1]),b=nzx(-12,12,[1,-1]),v=a*b;

    return {status:+m[1]===q.value.x&&+m[2]===q.value.y?'ok':'wrong'}}
  if(q.kind==='expr'){let pl;try{pl=parsePoly(raw)}catch(e){return {status:'format',msg:'Ik kan dit niet lezen. Controleer haakjes en tekens, bv. 3a^2 − 5b.'}}
    if(!pequal(pl,q.target))return {status:'wrong'};
    if(!isSimplified(raw,q.target))return {status:'format',msg:'Dat is gelijk aan de opgave, maar nog niet volledig vereenvoudigd. Werk verder uit.'};
    return {status:'ok'}}
  return {status:'wrong'};
}
if(typeof module!=='undefined'&&module.exports)module.exports={ZONES,makeQuestions,checkTyped,parsePoly,fmtPoly,pequal,isSimplified,normalize};
</script>
<script>

  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" role="img" aria-label="Kompas: ${nDone()} van 12 stukken"><circle cx="30" cy="30" r="15" fill="var(--card)" stroke="var(--line)"/>${seg}<path d="M30 16 L34 30 L30 44 L26 30Z" fill="var(--neg)"/><path d="M30 30 L34 30 L30 44 L26 30Z" fill="var(--ink-soft)"/><circle cx="30" cy="30" r="2" fill="var(--card)"/></svg>`}

/* ---------- start ---------- */
function startScreen(){

/* ---------- kaart ---------- */
function smoothPath(pts){let d=`M${pts[0].x},${pts[0].y}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x},${p2.y}`}return d}
function mapSVG(){
  const cur=ZONES.find(z=>unlocked(z.id)&&!done(z.id))||ZONES[ZONES.length-1];
  const island='M70,118 C52,58 150,22 214,36 C290,22 352,92 330,170 C360,236 312,292 336,362 C356,448 270,540 180,528 C96,546 22,476 40,396 C14,326 64,268 34,206 C22,160 78,152 70,118Z';
  let nodes='';
  for(const z of ZONES){const un=unlocked(z.id),dn=done(z.id),st=S.zones[z.id]?.stars||0;const left=z.ls==='l';
    nodes+=`<g class="node${un?'':' locked'}" data-id="${z.id}" tabindex="${un?0:-1}" role="button" aria-label="Zone ${z.id}: ${z.name}, ${z.topic}${dn?', '+st+' sterren':un?'':', op slot'}">
     ${z.id===cur.id&&!dn?`<circle class="pulse" cx="${z.x}" cy="${z.y}" r="22" fill="var(--accent)"/>`:''}
     <g class="ring" style="transform-origin:${z.x}px ${z.y}px"><circle cx="${z.x}" cy="${z.y}" r="16" fill="${dn?'var(--accent)':un?'var(--card)':'var(--lock)'}" stroke="var(--ink)" stroke-width="2.5"/>
     <text x="${z.x}" y="${z.y+6}" text-anchor="middle" font-family="Lilita One,sans-serif" font-size="16" fill="${dn?'var(--accent-ink)':'var(--ink)'}">${un?z.id:'🔒'.length?z.id:''}</text></g>
     <text x="${left?z.x-22:z.x+22}" y="${z.y-2}" text-anchor="${left?'end':'start'}" font-family="Lilita One,sans-serif" font-size="13" fill="var(--ink)" stroke="var(--halo)" stroke-width="3.5" paint-order="stroke">${z.name}</text>
     <text x="${left?z.x-22:z.x+22}" y="${z.y+12}" text-anchor="${left?'end':'start'}" font-family="Atkinson Hyperlegible,sans-serif" font-size="10.5" font-weight="700" fill="${z.alt<0?'var(--neg)':'var(--pos)'}" stroke="var(--halo)" stroke-width="3.5" paint-order="stroke">${z.alt>0?'+':z.alt<0?MIN:''}${Math.abs(z.alt)} m</text>
     ${dn?`<g transform="translate(${z.x-21},${z.y+17})">${[0,1,2].map(i=>`<path transform="translate(${i*14},0) scale(.58)" d="${starPath}" fill="${i<st?'var(--accent)':'var(--card)'}" stroke="var(--ink)" stroke-width="1.6"/>`).join('')}</g>`:''}
    </g>`}
  const me=cur;
  return `<svg viewBox="0 0 370 570" role="img" aria-label="Kaart van Eiland ℤ">
   <defs><pattern id="waves" width="40" height="22" patternUnits="userSpaceOnUse"><path d="M2 12 q8 -7 16 0 t16 0" fill="none" stroke="var(--sea-line)" stroke-width="1.6" stroke-linecap="round"/></pattern></defs>
   <rect width="370" height="570" fill="var(--sea)"/><rect width="370" height="570" fill="url(#waves)"/>
   <path d="${island}" fill="var(--sand-edge)" transform="translate(0,6)"/>
   <path d="${island}" fill="var(--sand)"/>
   <path d="M110,120 C140,70 230,70 270,120 C300,170 280,220 220,230 C160,240 90,200 110,120Z" fill="var(--grass)" opacity=".85"/>
   <path d="M128,150 C140,110 190,105 205,140 C215,170 180,190 155,185 C130,180 122,170 128,150Z" fill="var(--hill)"/>
   <path d="M60,230 C80,215 105,225 100,250 C95,270 60,270 52,255Z" fill="var(--hill)" opacity=".7"/>
   <path d="M190,330 C205,318 250,322 252,345 C255,372 210,378 192,362Z" fill="var(--ink)" opacity=".16"/>
   <path d="${smoothPath(ZONES)}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-dasharray="2 7" stroke-linecap="round" opacity=".55"/>
   <text x="18" y="540" font-family="Lilita One,sans-serif" font-size="22" fill="var(--ink)" opacity=".8">Eiland ℤ</text>
   <text x="18" y="557" font-family="Atkinson Hyperlegible,sans-serif" font-size="11" fill="var(--ink-soft)">hoogtes t.o.v. zeeniveau (0 m)</text>
   <g transform="translate(330,535)"><circle r="18" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><path d="M0,-14 L4,0 L0,14 L-4,0Z" fill="var(--neg)"/><text y="-21" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="Atkinson Hyperlegible,sans-serif">N</text></g>
   ${nodes}
   <g transform="translate(${me.x},${me.y-22})" aria-hidden="true"><path d="M0,0 C-10,-14 -10,-26 0,-26 C10,-26 10,-14 0,0Z" fill="${S.color}" stroke="var(--ink)" stroke-width="1.5"/><circle cy="-18" r="4" fill="#fff"/></g>
  </svg>`}
function mapScreen(){
  const allDone=nDone()===ZONES.length;
  if(allDone&&!S.finaleSeen){S.finaleSeen=true;save();return finaleScreen()}
  app.innerHTML=`${topBar()}
   ${allDone?`<div class="card tipbox"><h3>Kompas hersteld!</h3><p>Je hebt alle 12 stukken. Speel zones opnieuw om meer sterren te halen.</p></div>`:''}
   <div class="map-wrap">${mapSVG()}</div>
   <section><p class="eyebrow" style="margin-bottom:8px">Zones</p><div class="zlist">${ZONES.map(z=>{const un=unlocked(z.id),st=S.zones[z.id]?.stars||0;
     return `<button class="zitem${done(z.id)?' done':''}" data-id="${z.id}" ${un?'':'disabled'}><span class="znum">${z.id}</span><span class="t"><b>${z.name}</b><span>${z.topic}</span></span><span style="margin-left:auto;display:flex">${done(z.id)?[0,1,2].map(i=>starSVG(i<st,16)).join(''):`<span class="alt ${z.alt<0?'down':'up'}">${z.alt>0?'+':z.alt<0?MIN:''}${Math.abs(z.alt)} m</span>`}</span></button>`}).join('')}</div></section>
   <details class="teacher card"><summary>Voor de leerkracht</summary><div class="inner">
     <label class="row"><input type="checkbox" id="allz" ${S.all?'checked':''}> Alle zones vrijgeven (vrij oefenen per onderwerp)</label>
     <div class="row"><button class="btn ghost" id="reset">Voortgang wissen</button><span id="rc"></span></div>
     <p>Alle oefeningen worden telkens willekeurig gemaakt, volgens de herhalingsbundel. De voortgang blijft enkel op dit toestel bewaard.</p></div></details>`;
  app.querySelectorAll('.node,.zitem').forEach(el=>{const go=()=>{const id=+el.dataset.id;if(unlocked(id))introScreen(ZONES.find(z=>z.id===id))};
    el.addEventListener('click',go);if(el.classList.contains('node'))el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
  document.getElementById('allz').onchange=e=>{S.all=e.target.checked;save();mapScreen()};
  document.getElementById('reset').onclick=()=>{const rc=document.getElementById('rc');rc.innerHTML=`<button class="btn" id="rc2">Ja, alles wissen</button>`;
    document.getElementById('rc2').onclick=()=>{S.zones={};S.coins=0;S.finaleSeen=false;save();mapScreen()}};
}

/* ---------- zone-intro ---------- */
function introScreen(z){window.scrollTo(0,0);
  app.innerHTML=`${topBar()}<section class="card" style="display:grid;gap:16px">
   <p class="eyebrow">Zone ${z.id} · ${z.topic} · <span class="alt ${z.alt<0?'down':'up'}">${z.alt>0?'+':z.alt<0?MIN:''}${Math.abs(z.alt)} m</span></p>
   <h2 style="font-size:2rem">${z.name}</h2>
   <div class="guardian"><div class="avatar">${z.who.split(' ').pop()[0]}</div><div class="bubble"><b>${z.who}</b><p>${z.intro}</p></div></div>
   <div class="tipbox"><h3>Spiekbriefje</h3><p>${z.tip}</p></div>
   <div class="row"><button class="btn" id="go">Start de opdrachten</button><button class="btn ghost" id="back">Terug naar de kaart</button></div></section>`;
  document.getElementById('go').onclick=()=>startZone(z);document.getElementById('back').onclick=mapScreen;document.getElementById('go').focus();
}

/* ---------- spel ---------- */
let G=null;
function startZone(z){G={z,qs:makeQuestions(z),i:0,hearts:3,mist:0,streak:0,coins:0,res:[]};renderQ()}
function hud(){return `<div class="hud"><button class="btn ghost" id="quit">← Kaart</button><div class="dots" aria-label="Opdracht ${G.i+1} van 8">${G.qs.map((q,i)=>`<i class="${G.res[i]===true?'ok':G.res[i]===false?'no':''}${i===G.i?' cur':''}"></i>`).join('')}</div><div class="hearts" aria-label="${G.hearts} hartjes">${[0,1,2].map(i=>heartSVG(i<G.hearts)).join('')}</div></div>`}
function renderQ(){
  const q=G.qs[G.i],z=G.z;let ans='';
  if(q.options){ans=`<div class="opts ${q.layout||''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.label}</button>`).join('')}</div>`}
  else if(q.kind==='nl'){ans=`<div class="nlbox">${nlSVG()}</div><p class="hint">Klik op het juiste streepje.</p>`}
  else if(q.kind==='grid'){ans=`<div class="svgbox">${gridSVG([],true)}</div><p class="hint">Klik op het snijpunt van de rasterlijnen.</p>`}
  else{const keys=keySet(q,z);ans=`<form class="typein" id="tf" autocomplete="off"><div class="line"><input id="ti" aria-label="Je antwoord" placeholder="${esc(z.hint||'Je antwoord')}" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Controleer</button></div>
    <div class="keys">${keys.map(k=>`<button type="button" data-k="${esc(k)}">${k==='bestaat niet'?'bestaat niet':esc(k)}</button>`).join('')}</div><p class="hint">${esc(z.hint||'')}</p><p class="warn" id="warn" hidden></p></form>`}
  app.innerHTML=`${hud()}<section class="card qcard">
    <div class="qmeta"><span class="eyebrow">${z.name} · opdracht ${G.i+1} van 8</span><span class="eyebrow">${q.options?'meerkeuze':(q.kind==='nl'||q.kind==='grid')?'aanklikken':'zelf invullen'}${G.streak>=3?` · reeks ${G.streak}`:''}</span></div>
    <p class="instr">${q.instr}</p>
    <div class="math${q.layout==='words'||(q.visual&&q.kind!=='grid')?' small':''}">${q.math}</div>
    ${q.visual||''}
    ${q.grid?`<div class="svgbox">${gridSVG(q.grid.points,false)}</div>`:''}
    ${ans}<div id="fb"></div></section>`;
  document.getElementById('quit').onclick=mapScreen;
  if(q.options)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.i];
    app.querySelectorAll('.opt').forEach((x,i)=>{x.disabled=true;if(q.options[i].correct)x.classList.add('right')});if(!o.correct)b.classList.add('wrong');resolve(o.correct)});
  else if(q.kind==='nl')bindNL(q);
  else if(q.kind==='grid')bindGrid(q);
  else{const inp=document.getElementById('ti'),warn=document.getElementById('warn');inp.focus({preventScroll:true});
    app.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='bestaat niet'){inp.value='bestaat niet'}else{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+k+inp.value.slice(e);inp.setSelectionRange(s+k.length,s+k.length)}inp.focus()});
    document.getElementById('tf').onsubmit=e=>{e.preventDefault();const r=checkTyped(q,inp.value);
      if(r.status==='empty'||r.status==='format'){warn.hidden=false;warn.textContent=r.msg;return}
      inp.disabled=true;app.querySelectorAll('#tf button').forEach(b=>b.disabled=true);resolve(r.status==='ok')}}
}
function keySet(q,z){if(q.kind==='coord')return ['(','−',',',')'];if(q.kind==='expr'){const v=q.vars&&q.vars.length?q.vars:['a','b'];return ['−',...v,'²','³','⁴','⁵','^','(',')']}
  return q.kind==='intbn'?['−','bestaat niet']:['−']}
function resolve(ok){
  const q=G.qs[G.i];G.res[G.i]=ok;
  if(ok){G.streak++;const bonus=G.streak>=3?5:0;G.coins+=10+bonus}else{G.streak=0;G.hearts--;G.mist++}
  const dead=G.hearts<=0;const last=G.i===G.qs.length-1;
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?pick(['Juist!','Prima!','Goed gedaan!','Helemaal juist!']):'Niet juist'}</h3>
    ${ok?'':`<p>Het juiste antwoord is <b>${q.answerLabel}</b>.</p>`}<p>${q.explain}</p>
    <div class="row"><button class="btn" id="next">${dead?'Verder':last?'Bekijk resultaat':'Volgende opdracht'}</button></div></div>`;
  app.querySelector('.hud').outerHTML=hud();document.getElementById('quit').onclick=mapScreen;
  const nx=document.getElementById('next');nx.focus({preventScroll:true});fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  nx.onclick=()=>{if(dead)return failScreen();if(last)return doneScreen();G.i++;renderQ();window.scrollTo({top:0})};
}
function doneScreen(){const z=G.z;const stars=G.mist===0?3:G.mist===1?2:1;const prev=S.zones[z.id]?.stars||0;const first=!prev;
  S.zones[z.id]={stars:Math.max(prev,stars)};S.coins+=G.coins;save();
  const next=ZONES.find(x=>x.id===z.id+1);
  app.innerHTML=`${topBar()}<section class="card result"><p class="eyebrow">${z.name}</p><h2>${first?'Kompasstuk gevonden!':'Zone opnieuw gehaald!'}</h2>
   <div class="bigstars">${[0,1,2].map(i=>`<span class="pop" style="animation-delay:${i*.15}s">${starSVG(i<stars,48)}</span>`).join('')}</div>
   <p>${G.mist===0?'Geen enkele fout. Knap werk!':`${G.mist} ${G.mist===1?'fout':'fouten'}. ${stars<3?'Speel opnieuw voor meer sterren.':''}`}</p>
   <p class="stat" style="justify-content:center">${coinSVG} +${G.coins} munten</p>
   <div class="compass">${compassSVG(90)}</div><p>${nDone()} van 12 stukken van het kompas</p>
   <div class="row" style="justify-content:center">${next&&nDone()<12?`<button class="btn" id="nz">Naar ${next.name}</button>`:''}<button class="btn ${next&&nDone()<12?'ghost':''}" id="mp">Naar de kaart</button><button class="btn ghost" id="ag">Opnieuw spelen</button></div></section>`;
  const nz_=document.getElementById('nz');if(nz_)nz_.onclick=()=>introScreen(next);
  document.getElementById('mp').onclick=mapScreen;document.getElementById('ag').onclick=()=>startZone(z);
}
function failScreen(){const z=G.z;S.coins+=G.coins;save();
  app.innerHTML=`${topBar()}<section class="card result"><p class="eyebrow">${z.name}</p><h2>Je hartjes zijn op</h2>
   <p>Geen probleem: elke poging maakt je sterker. Lees het spiekbriefje nog eens en probeer opnieuw.</p>
   <div class="tipbox" style="text-align:left"><h3>Spiekbriefje</h3><p>${z.tip}</p></div>
   <div class="row" style="justify-content:center"><button class="btn" id="ag">Opnieuw proberen</button><button class="btn ghost" id="mp">Naar de kaart</button></div></section>`;
  document.getElementById('ag').onclick=()=>startZone(z);document.getElementById('mp').onclick=mapScreen;
}
function finaleScreen(){app.innerHTML=`${topBar()}<section class="card result"><p class="eyebrow">Eiland ℤ</p><h2>Het kompas is hersteld!</h2><div class="pop">${compassSVG(140)}</div>
  <p class="story">Professor Nul stapt in zijn luchtballon en wijst naar het noorden. “Zonder jou was ik hier nooit weggeraakt, ${esc(S.name)}!” Je verzamelde ${totalStars()} van de 36 sterren.</p>
  <div class="row" style="justify-content:center"><button class="btn" id="mp">Naar de kaart</button></div></section>`;document.getElementById('mp').onclick=mapScreen}

/* ---------- getallenas ---------- */
const NX=n=>30+(n+10)*28;
function nlSVG(){let s=`<svg viewBox="0 0 620 96" role="group" aria-label="Getallenas van −10 tot 10"><line x1="14" y1="46" x2="606" y2="46" stroke="var(--ink)" stroke-width="2"/><path d="M606 46 l-9 -5 v10z" fill="var(--ink)"/>`;
  for(let n=-10;n<=10;n++){const x=NX(n);s+=`<line x1="${x}" y1="${n===0?34:38}" x2="${x}" y2="${n===0?58:54}" stroke="var(--ink)" stroke-width="${n===0?3:1.6}"/>`;
    s+=`<text x="${x}" y="78" text-anchor="middle" font-size="${n%2===0?15:12}" font-weight="${n===0?700:400}" fill="${n%2===0?'var(--ink)':'var(--ink-soft)'}" font-family="Atkinson Hyperlegible,sans-serif">${f(n)}</text>`;
    s+=`<rect class="hit" data-n="${n}" x="${x-14}" y="4" width="28" height="88" fill="transparent" style="cursor:pointer"><title>${f(n)}</title></rect>`}
  return s+`<g id="nlmarks"></g></svg>`}
function bindNL(q){const svg=app.querySelector('.nlbox svg');let fired=false;
  svg.querySelectorAll('.hit').forEach(r=>{r.addEventListener('mouseenter',()=>{if(!fired)r.setAttribute('fill','color-mix(in srgb,var(--accent) 25%,transparent)')});r.addEventListener('mouseleave',()=>r.setAttribute('fill','transparent'));
    r.addEventListener('click',()=>{if(fired)return;fired=true;r.setAttribute('fill','transparent');const n=+r.dataset.n,ok=n===q.value;
      const mk=(v,col)=>`<g><path d="M${NX(v)},42 l-8,-14 h16z" fill="${col}"/><text x="${NX(v)}" y="22" text-anchor="middle" font-size="15" font-weight="700" font-family="Lilita One,sans-serif" fill="${col}">${q.letter}</text></g>`;
      svg.querySelector('#nlmarks').innerHTML=(ok?'':mk(n,'var(--neg)'))+mk(q.value,'var(--pos)');resolve(ok)})})}
/* ---------- rooster ---------- */
const U=22,O=160;
function gridSVG(points,interactive){let s=`<svg viewBox="0 0 320 320" ${interactive?'class="clickgrid" role="group" aria-label="Assenstelsel, klik op een roosterpunt"':'role="img" aria-label="Assenstelsel"'}>`;
  for(let i=-6;i<=6;i++){const c=O+i*U;s+=`<line x1="${c}" y1="${O-6*U}" x2="${c}" y2="${O+6*U}" stroke="var(--line)" stroke-width="1"/><line x1="${O-6*U}" y1="${c}" x2="${O+6*U}" y2="${c}" stroke="var(--line)" stroke-width="1"/>`}
  s+=`<line x1="${O-6*U-8}" y1="${O}" x2="${O+6*U+10}" y2="${O}" stroke="var(--ink)" stroke-width="1.8"/><line x1="${O}" y1="${O+6*U+8}" x2="${O}" y2="${O-6*U-10}" stroke="var(--ink)" stroke-width="1.8"/>`;
  s+=`<path d="M${O+6*U+12} ${O} l-8 -4 v8z" fill="var(--ink)"/><path d="M${O} ${O-6*U-12} l-4 8 h8z" fill="var(--ink)"/><text x="${O+6*U+6}" y="${O+16}" class="gtxt" font-weight="700">x</text><text x="${O+8}" y="${O-6*U-4}" class="gtxt" font-weight="700">y</text>`;
  for(let i=-6;i<=6;i++){if(i===0)continue;if(i%2===0){s+=`<text x="${O+i*U}" y="${O+14}" text-anchor="middle" class="gtxt">${f(i)}</text><text x="${O-6}" y="${O-i*U+4}" text-anchor="end" class="gtxt">${f(i)}</text>`}
    s+=`<line x1="${O+i*U}" y1="${O-3}" x2="${O+i*U}" y2="${O+3}" stroke="var(--ink)"/><line x1="${O-3}" y1="${O-i*U}" x2="${O+3}" y2="${O-i*U}" stroke="var(--ink)"/>`}
  s+=`<text x="${O-5}" y="${O+14}" text-anchor="end" class="gtxt">0</text>`;
  for(const pt of points)s+=ptMark(pt.x,pt.y,pt.label,'var(--accent)');
  if(interactive)s+=`<g id="hov"></g><g id="gmarks"></g><rect id="gcatch" x="0" y="0" width="320" height="320" fill="transparent" style="cursor:crosshair"/>`;
  return s+'</svg>'}
function ptMark(x,y,L,col){const cx=O+x*U,cy=O-y*U;return `<g><circle cx="${cx}" cy="${cy}" r="6" fill="${col}" stroke="var(--ink)" stroke-width="1.5"/><text x="${cx+8}" y="${cy-8}" font-family="Lilita One,sans-serif" font-size="15" fill="var(--ink)" stroke="var(--card)" stroke-width="3" paint-order="stroke">${L}</text></g>`}
function bindGrid(q){const svg=app.querySelector('.clickgrid');let fired=false;
  const toPt=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const l=pt.matrixTransform(svg.getScreenCTM().inverse());
    return {x:Math.max(-6,Math.min(6,Math.round((l.x-O)/U))),y:Math.max(-6,Math.min(6,Math.round((O-l.y)/U)))}};
  const c=svg.querySelector('#gcatch'),hov=svg.querySelector('#hov');
  c.addEventListener('pointermove',e=>{if(fired)return;const g=toPt(e);hov.innerHTML=`<circle cx="${O+g.x*U}" cy="${O-g.y*U}" r="7" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`});
  c.addEventListener('pointerleave',()=>hov.innerHTML='');
  c.addEventListener('click',e=>{if(fired)return;fired=true;hov.innerHTML='';const g=toPt(e);const ok=g.x===q.value.x&&g.y===q.value.y;
    svg.querySelector('#gmarks').innerHTML=(ok?'':ptMark(g.x,g.y,'?','var(--neg)'))+ptMark(q.value.x,q.value.y,q.letter,'var(--pos)');resolve(ok)})}

startScreen();
})();
</script>
