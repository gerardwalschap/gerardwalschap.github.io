<title>Getallenshow ℕℤ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: quizstudio — een puntenbord als hoofdscherm (max 980px), vragen in een kaart die het bord vervangt. ℕ = groenblauw, ℤ = koraal. */
:root{
  --bg:#eef4f2; --stage:#ffffff; --ink:#18252b; --ink-soft:#56676d; --line:#d3e0dc;
  --n:#14806b; --n-soft:#d6efe8; --n-ink:#ffffff;
  --z:#e2522f; --z-soft:#fbe0d7; --z-ink:#ffffff;
  --gold:#f4b400; --gold-ink:#3b2a00; --ok:#1f8a4c; --ok-bg:#dff3e6; --no:#c8372d; --no-bg:#fbe3e0; --done:#e3ebe8;
  --f-display:"Bowlby One","Arial Black",Impact,sans-serif; --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a1d; --stage:#18252a; --ink:#ecf3f1; --ink-soft:#9fb3b0; --line:#2a3b40;
  --n:#2bb193; --n-soft:#143b33; --n-ink:#06201a; --z:#ff7552; --z-soft:#43221a; --z-ink:#2a0d05;
  --gold:#ffc83d; --gold-ink:#2e2000; --ok:#5fd394; --ok-bg:#163826; --no:#ff8579; --no-bg:#43201d; --done:#22333a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a1d; --stage:#18252a; --ink:#ecf3f1; --ink-soft:#9fb3b0; --line:#2a3b40;
  --n:#2bb193; --n-soft:#143b33; --n-ink:#06201a; --z:#ff7552; --z-soft:#43221a; --z-ink:#2a0d05;
  --gold:#ffc83d; --gold-ink:#2e2000; --ok:#5fd394; --ok-bg:#163826; --no:#ff8579; --no-bg:#43201d; --done:#22333a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:16px 48px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;background:var(--gold);color:var(--gold-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.small{padding:7px 14px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.stage{background:var(--stage);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink-soft)}
.soft{color:var(--ink-soft)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.set-n{--c:var(--n);--cs:var(--n-soft);--ci:var(--n-ink)} .set-z{--c:var(--z);--cs:var(--z-soft);--ci:var(--z-ink)}
.badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;background:var(--c);color:var(--ci);font-weight:800;font-size:.85rem}

/* start */
.logo{font-size:clamp(2.8rem,11vw,5.2rem);letter-spacing:-.01em}
.logo .n{color:var(--n)} .logo .z{color:var(--z)}
.field input{font:inherit;padding:11px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;max-width:300px}
.pick{display:grid;gap:14px}
.group h3{font-size:1.15rem;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--c);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--c);color:var(--ci)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.stats{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:minmax(0,190px) 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.srow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.track{height:10px;border-radius:999px;background:var(--done);overflow:hidden}
.track i{display:block;height:100%;background:var(--c);border-radius:999px}
.srow .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* bord */
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums}
.score small{font-family:var(--f-body);font-size:.8rem;color:var(--ink-soft);font-weight:600;display:block;line-height:1}
.board-wrap{overflow-x:auto}
.board{display:grid;gap:8px;min-width:0}
.colhead{background:var(--c);color:var(--ci);border-radius:10px;padding:10px 8px;font-weight:800;font-size:.86rem;line-height:1.2;text-align:center;display:grid;place-items:center;gap:4px;min-height:74px;hyphens:auto;overflow-wrap:anywhere}
.colhead .short{display:none}
.colhead .badge{background:var(--ci);color:var(--c)}
.tile{border:0;border-radius:10px;min-height:64px;background:var(--cs);color:var(--c);font-family:var(--f-display);font-size:clamp(1.05rem,3.4vw,1.7rem);box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 30%,transparent);transition:transform .12s}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:disabled{cursor:default;background:var(--done);color:var(--ink-soft);box-shadow:none;font-family:var(--f-body);font-weight:800;font-size:.95rem}
.tile.ok:disabled{color:var(--ok)} .tile.no:disabled{color:var(--no)}

/* vraag */
.qcard{display:grid;gap:16px}
.qcard>*{min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--cs);color:var(--ink);font-weight:800;font-size:.9rem}
.joker{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center}
.joker b{font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.instr{font-weight:600}
.math{font-size:clamp(1.6rem,6vw,2.4rem);font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.math.small{font-size:1.15rem;font-weight:600}
.blank{display:inline-block;min-width:1.5em;text-align:center;border-bottom:3px solid var(--gold);color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.cmp{grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.words{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--stage);border-radius:12px;padding:14px 10px;font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.opts.cmp .opt{font-size:2rem;padding:8px}
.opts.words .opt{font-size:1.02rem;text-align:left;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.wrong{border-color:var(--no);background:var(--no-bg)}
.opt:disabled{cursor:default}
.typein{display:grid;gap:10px}
.typein>*{min-width:0}
.typein .line{display:flex;gap:10px;flex-wrap:wrap}
.typein input{flex:1 1 200px;min-width:0;width:100%;font:inherit;font-size:1.4rem;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:42px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:1.05rem}
.hint{font-size:.88rem;color:var(--ink-soft)}
.warn{color:var(--no);font-weight:600}
.fb{border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--ok-bg)} .fb.no{background:var(--no-bg)}
.fb h3{font-size:1.4rem} .fb.ok h3{color:var(--ok)} .fb.no h3{color:var(--no)}
.fb .st{display:block;font-variant-numeric:tabular-nums}
.fb .row{justify-content:flex-end}
.tbl-wrap{overflow-x:auto}
.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 10px;text-align:center;white-space:nowrap}
.tbl th{text-align:left;font-size:.9rem;background:var(--bg)}
.tb-blank{background:color-mix(in srgb,var(--gold) 30%,transparent);font-weight:800}
.svgbox{max-width:420px;width:100%;margin:0 auto}
.svgbox svg,.nlbox svg{display:block;width:100%;height:auto}
.gtxt{fill:var(--ink-soft);font-family:var(--f-body);font-size:11px}
.result{display:grid;gap:14px;justify-items:center;text-align:center}
.big{font-family:var(--f-display);font-size:clamp(3rem,14vw,5.5rem);line-height:1;color:var(--gold)}
@media (max-width:560px){.colhead .long{display:none}.colhead .short{display:block;overflow-wrap:normal;word-break:normal;white-space:nowrap;font-size:.66rem}.stage.bordstage{padding:8px}body{font-size:16px}.stage{padding:16px}.colhead{font-size:.72rem;min-height:66px;padding:8px 4px}.tile{min-height:54px}.board{gap:6px}.srow{grid-template-columns:minmax(0,1fr) 70px 44px}}

<div id="app" lang="nl" aria-live="polite"></div>
<script>/* ===== Expeditie ℤ — logica: hulpfuncties, veeltermen, generatoren ===== */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const nz=(a,b)=>{let v;do{v=R(a,b)}while(v===0);return v};
const nzx=(a,b,ex)=>{let v;do{v=R(a,b)}while(v===0||ex.includes(v));return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const MIN='−';
const f=n=>n<0?MIN+(-n):String(n);
const p=n=>n<0?'('+f(n)+')':f(n);
const SUPC={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const SUBC={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sup=n=>String(n).split('').map(c=>SUPC[c]||c).join('');
const sub=n=>String(n).split('').map(c=>SUBC[c]||c).join('');
const isInt=x=>Number.isInteger(x);

/* ---------- veeltermen ---------- */
function vexp(k){const m={};for(const x of k.matchAll(/([a-z])(\d+)/g))m[x[1]]=(m[x[1]]||0)+ +x[2];return m}
function vkey(m){return Object.keys(m).filter(v=>m[v]!==0).sort().map(v=>v+m[v]).join('')}
function clean(a){const r={};for(const k in a)if(Math.abs(a[k])>1e-9)r[k]=a[k];return r}
function padd(a,b){const r={...a};for(const k in b)r[k]=(r[k]||0)+b[k];return clean(r)}
function pneg(a){const r={};for(const k in a)r[k]=-a[k];return r}
function pmul(a,b){const r={};for(const ka in a)for(const kb in b){const m=vexp(ka),n=vexp(kb);for(const v in n)m[v]=(m[v]||0)+n[v];const k=vkey(m);r[k]=(r[k]||0)+a[ka]*b[kb]}return clean(r)}
function pdiv(a,b){const ks=Object.keys(b);if(ks.length!==1)throw new Error('deling');const kb=ks[0],cb=b[kb];const r={};for(const ka in a){const m=vexp(ka),n=vexp(kb);for(const v in n){m[v]=(m[v]||0)-n[v];if(m[v]<0)throw new Error('deling')}const k=vkey(m);r[k]=(r[k]||0)+a[ka]/cb}return clean(r)}
function ppow(a,n){if(!isInt(n)||n<0||n>20)throw new Error('exp');let r={'':1};for(let i=0;i<n;i++)r=pmul(r,a);return r}
function pequal(a,b){const d=padd(a,pneg(b));return Object.keys(d).length===0}
function pconst(a){const ks=Object.keys(a);if(ks.length===0)return 0;if(ks.length===1&&ks[0]==='')return a[''];return null}

function normalize(s){
  s=String(s).toLowerCase().replace(/[−–—]/g,'-').replace(/[·×∙•*⋅]/g,'*').replace(/[:÷\/]/g,'/');
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.split('').map(c=>Object.keys(SUPC).find(k=>SUPC[k]===c)).join(''));
  return s.replace(/\s+/g,'');
}
function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];
  if(/\d/.test(c)){let j=i;while(j<s.length&&/[\d.]/.test(s[j]))j++;t.push({t:'n',v:parseFloat(s.slice(i,j))});i=j}
  else if(/[a-z]/.test(c)){t.push({t:'v',v:c});i++}
  else if('+-*/^()'.includes(c)){t.push({t:c});i++}
  else throw new Error('teken')}return t}
function parsePoly(str){
  const t=tokenize(normalize(str));if(!t.length)throw new Error('leeg');let i=0;
  const pk=()=>t[i];
  function expr(){let r=term();while(pk()&&(pk().t==='+'||pk().t==='-')){const op=t[i++].t;const b=term();r=op==='+'?padd(r,b):padd(r,pneg(b))}return r}
  function term(){let r=factor();for(;;){const n=pk();if(!n)break;
    if(n.t==='*'){i++;r=pmul(r,factor())}
    else if(n.t==='/'){i++;r=pdiv(r,factor())}
    else if(n.t==='v'||n.t==='('){r=pmul(r,power())}
    else break}return r}
  function factor(){const n=pk();if(!n)throw new Error('einde');
    if(n.t==='-'){i++;return pneg(factor())}if(n.t==='+'){i++;return factor()}return power()}
  function power(){let b=atom();if(pk()&&pk().t==='^'){i++;let e;
      if(pk()&&pk().t==='n'){e=t[i++].v}
      else if(pk()&&pk().t==='('){i++;if(!pk()||pk().t!=='n')throw new Error('exp');e=t[i++].v;if(!pk()||pk().t!==')')throw new Error('exp');i++}
      else throw new Error('exp');
      b=ppow(b,e)}return b}
  function atom(){const n=t[i++];if(!n)throw new Error('einde');
    if(n.t==='n')return clean({'':n.v});
    if(n.t==='v')return {[n.v+'1']:1};
    if(n.t==='('){const r=expr();if(!pk()||pk().t!==')')throw new Error('haakje');i++;return r}
    throw new Error('syntax')}
  const r=expr();if(i!==t.length)throw new Error('rest');return r;
}
function isSimplified(raw,target){
  const s=normalize(raw);if(/[()\/]/.test(s))return false;
  const terms=s.replace(/^[+-]/,'').split(/[+-]/);
  if(terms.some(x=>x===''))return false;
  for(const x of terms){const y=x.replace(/\^\d+/g,'');const nums=y.match(/\d+(\.\d+)?/g)||[];const vars=y.match(/[a-z]/g)||[];
    if(nums.length>1)return false;if(new Set(vars).size!==vars.length)return false;if(/\^/.test(y))return false}
  const n=Math.max(1,Object.keys(target).length);
  return terms.length===n;
}
const VORDER=['a','b','x','y'];
function fmtNum(n){return isInt(n)?String(n):String(Math.round(n*100)/100).replace('.',',')}
function fmtPoly(pl){
  const ks=Object.keys(pl);if(!ks.length)return '0';
  const deg=k=>Object.values(vexp(k)).reduce((s,e)=>s+e,0);
  ks.sort((x,y)=>{const d=deg(y)-deg(x);if(d)return d;const ex=vexp(x),ey=vexp(y);for(const v of VORDER){const c=(ey[v]||0)-(ex[v]||0);if(c)return c}return 0});
  return ks.map((k,i)=>{const c=pl[k],a=Math.abs(c);const m=vexp(k);
    const vars=Object.keys(m).sort().map(v=>v+(m[v]===1?'':sup(m[v]))).join('');
    const core=(a===1&&vars?'':fmtNum(a))+vars;
    return i===0?(c<0?MIN:'')+core:(c<0?' '+MIN+' ':' + ')+core}).join('');
}

/* ---------- meerkeuze ---------- */
function intOptions(v,wrongs,extra){
  const lab=x=>typeof x==='number'?f(x):x;
  const seen=new Set([lab(v)]);const o=[{label:lab(v),correct:true}];
  const add=w=>{if(o.length>=4)return;if(typeof w==='number'&&!isInt(w))return;const l=lab(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  (extra||[]).forEach(add);wrongs.forEach(add);
  let g=0;while(o.length<4&&g++<80){const base=typeof v==='number'?v:0;add(pick([-base,base+nz(-6,6),base+nz(-3,3),base*2]))}
  return shuffle(o);
}
function perturb(pl){const r={...pl};const ks=Object.keys(r);if(!ks.length)return {a1:1};const k=pick(ks);const t=R(0,2);
  if(t===0)r[k]=-r[k];else if(t===1){r[k]+=nz(-2,2)}else{const m=vexp(k);const v=Object.keys(m)[0];if(v){m[v]=m[v]+pick([1,-1]);const c=r[k];delete r[k];const nk=vkey(m);r[nk]=(r[nk]||0)+c}else r[k]=-r[k]}
  return clean(r)}
function exprOptions(target,wrongs){
  const seen=new Set([fmtPoly(target)]);const o=[{label:fmtPoly(target),correct:true}];
  const add=w=>{if(o.length>=4||!w)return;if(pequal(w,target))return;const l=fmtPoly(w);if(!seen.has(l)){seen.add(l);o.push({label:l,correct:false})}};
  wrongs.forEach(w=>{try{add(typeof w==='string'?parsePoly(w):w)}catch(e){}});
  let g=0;while(o.length<4&&g++<80)add(perturb(target));
  return shuffle(o);
}
/* bouwt een vraag met getal-antwoord */
function intQ(mode,{instr,math,v,wrongs=[],explain,bn=false}){
  const q={instr,math,explain,answerLabel:v===null?'bestaat niet':f(v)};
  if(mode==='mc'){q.options=intOptions(v===null?'bestaat niet':v,wrongs,bn?['bestaat niet']:[])}
  else{q.kind=bn?'intbn':'int';q.value=v}
  return q}
function exprQ(mode,{instr,math,target,wrongs=[],explain,vars}){
  const q={instr,math,explain,answerLabel:fmtPoly(target),vars};
  if(mode==='mc')q.options=exprOptions(target,wrongs);else{q.kind='expr';q.target=target}
  return q}

/* ---------- uitleghulp ---------- */
function sumExplain(x,y){const v=x+y;
  if(x===0||y===0)return `Optellen met 0 verandert niets: ${f(v)}.`;
  if(x===-y)return `${f(x)} en ${f(y)} zijn tegengestelde getallen: hun som is 0.`;
  if(Math.sign(x)===Math.sign(y))return `${f(x)} en ${f(y)} hebben hetzelfde teken: tel ${Math.abs(x)} + ${Math.abs(y)} = ${Math.abs(v)} en behoud het teken → <b>${f(v)}</b>.`;
  const big=Math.abs(x)>Math.abs(y)?x:y,sm=big===x?y:x;
  return `Verschillend teken: ${Math.abs(big)} − ${Math.abs(sm)} = ${Math.abs(v)}. Neem het teken van ${f(big)} (grootste absolute waarde) → <b>${f(v)}</b>.`}
function signText(nNeg){return nNeg%2===0?`${nNeg===0?'geen':'een even aantal ('+nNeg+')'} mintekens → positief`:`een oneven aantal (${nNeg}) mintekens → negatief`}
const steps=(start,arr)=>`<span class="st">${start}</span>`+arr.map(s=>`<span class="st">= ${s}</span>`).join('');

/* ===== ZONE 1: optellen en aftrekken ===== */
function genAdd(mode){
  const a=nz(-20,20),b=nz(-15,15),minus=Math.random()<.55;
  const math=`${f(a)} ${minus?MIN:'+'} ${p(b)}`;const b2=minus?-b:b,v=a+b2;
  let ex='';if(minus)ex+=`Aftrekken = optellen met het tegengestelde: ${math} = ${f(a)} + ${p(-b)}.<br>`;
  ex+=sumExplain(a,b2);
  return intQ(mode,{instr:'Bereken.',math,v,wrongs:[a-b2,-v,(v<0?-1:1)*(Math.abs(a)+Math.abs(b2)),-a+b2],explain:ex});
}
/* ===== ZONE 2: vermenigvuldigen en delen ===== */
function genMul(mode){
  const t=R(0,4);
  if(t===0){const a=nzx(-12,12,[1,-1]),b=nzx(-12,12,[1,-1]),v=a*b;
    return intQ(mode,{instr:'Bereken.',math:`${f(a)} · ${p(b)}`,v,wrongs:[-v,a+b,a-b],explain:`Tekenregel: ${signText((a<0)+(b<0))}. ${Math.abs(a)} · ${Math.abs(b)} = ${Math.abs(v)} → <b>${f(v)}</b>.`})}
  if(t===1){const b=nzx(-12,12,[1,-1]),q=nzx(-12,12,[1,-1]),a=b*q;

 {s:'a²',u:'A²',f:(a,b)=>a*a},{s:'3a − b',u:'3 · A − B',f:(a,b)=>3*a-b},{s:'a · b²',u:'A · B²',f:(a,b)=>a*b*b},
 {s:'a³',u:'A³',f:(a,b)=>a**3},{s:'(a + b)²',u:'(A + B)²',f:(a,b)=>(a+b)**2,m:(a,b)=>`${p(a+b)}²`},
 {s:'−2a(a − b)',u:'−2 · A · (A − B)',f:(a,b)=>-2*a*(a-b),m:(a,b)=>`${MIN}2 · ${p(a)} · ${p(a-b)}`},
 {s:'2a² − 3b',u:'2 · A² − 3 · B',f:(a,b)=>2*a*a-3*b,m:(a,b)=>`2 · ${a*a} − ${p(3*b)}`},
 {s:'b² − a²',u:'B² − A²',f:(a,b)=>b*b-a*a,m:(a,b)=>`${b*b} − ${a*a}`},
 {s:'5a − b · b',u:'5 · A − B · B',f:(a,b)=>5*a-b*b,m:(a,b)=>`${f(5*a)} − ${p(b*b)}`},
 {s:'−a²',u:'−A²',f:(a,b)=>-a*a},{s:'a² + ab',u:'A² + A · B',f:(a,b)=>a*a+a*b,m:(a,b)=>`${a*a} + ${p(a*b)}`},
 {s:'(a − b)(a + b)',u:'(A − B) · (A + B)',f:(a,b)=>(a-b)*(a+b),m:(a,b)=>`${p(a-b)} · ${p(a+b)}`},
 {s:'−b + 4a',u:'−B + 4 · A',f:(a,b)=>-b+4*a},{s:'ab − b',u:'A · B − B',f:(a,b)=>a*b-b,m:(a,b)=>`${f(a*b)} − ${p(b)}`}];
function genGW(mode){
  const a=Math.random()<.75?-R(1,4):R(2,4),b=a<0?R(1,4)*(Math.random()<.2?-1:1):-R(1,4);

/* ===== ZONE 10: rekenregels machten ===== */
function genPowRules(mode){
  const t=R(0,8);const I='Vereenvoudig met de rekenregels van machten.';let math,wr=[],rule;
  const v=pick(['a','x','y','b']);
  if(t===0){const m=R(2,7),n=R(2,6);math=`${v}${sup(m)} · ${v}${sup(n)}`;wr=[`${v}^${m*n}`,`2${v}^${m+n}`];rule=`Zelfde grondtal vermenigvuldigen: tel de exponenten op. ${v}${sup(m)} · ${v}${sup(n)} = ${v}<sup>${m}+${n}</sup>`}
  if(t===1){const m=R(2,5),n=R(2,4);math=`(${v}${sup(m)})${sup(n)}`;wr=[`${v}^${m+n}`,`${n}${v}^${m}`];rule=`Macht van een macht: vermenigvuldig de exponenten. (${v}${sup(m)})${sup(n)} = ${v}<sup>${m}·${n}</sup>`}
  if(t===2){const n=R(2,5),m=n+R(2,7);math=`${v}${sup(m)} : ${v}${sup(n)}`;wr=[`${v}^${m+n}`,isInt(m/n)?`${v}^${m/n}`:`${v}^${m-n+1}`];rule=`Zelfde grondtal delen: trek de exponenten af. ${v}${sup(m)} : ${v}${sup(n)} = ${v}<sup>${m}−${n}</sup>`}
  if(t===3){const k=nzx(-6,6,[1,-1]),l=nzx(-6,6,[1,-1]),m=R(1,5),n=R(2,5);const xm=m===1?v:v+sup(m);math=`${f(k)}${xm} · ${p(l)}${v}${sup(n)}`;
    if(l>0)math=`${f(k)}${xm} · ${l}${v}${sup(n)}`;wr=[`${k+l}${v}^${m+n}`,`${k*l}${v}^${m*n}`,`${-k*l}${v}^${m+n}`];rule=`Vermenigvuldig de coëfficiënten (${f(k)} · ${p(l)} = ${f(k*l)}) en tel de exponenten op`}
  if(t===4){const k=pick([2,3,-2,-3]),m=R(2,4),n=pick([2,3]);math=`(${f(k)}${v}${sup(m)})${sup(n)}`;wr=[`${k}${v}^${m*n}`,`${k*n}${v}^${m*n}`,`${-(k**n)}${v}^${m*n}`,`${k**n}${v}^${m+n}`];rule=`Elke factor tot de macht ${n}: (${f(k)})${sup(n)} = ${f(k**n)} en (${v}${sup(m)})${sup(n)} = ${v}${sup(m*n)}`}
  if(t===5){const q=nzx(-6,6,[1,-1]),c=nzx(-6,6,[1,-1]),n=R(1,4),m=n+R(1,5);const pc=q*c;const xn=n===1?v:v+sup(n);math=`${f(pc)}${v}${sup(m)} : (${f(c)}${xn})`;wr=[`${-q}${v}^${m-n}`,`${q}${v}^${m+n}`,`${pc-c}${v}^${m-n}`];rule=`Deel de coëfficiënten (${f(pc)} : ${p(c)} = ${f(q)}) en trek de exponenten af`}
  if(t===6){const [x,y]=pick([['x','y'],['a','b']]);const m=R(2,4),n=R(2,3);math=`(${x}${sup(m)}${y})${sup(n)}`;wr=[`${x}^${m*n}*${y}`,`${x}^${m+n}*${y}^${n}`];rule=`Macht van een product: elke factor tot de macht ${n}`}
  if(t===7){const k=R(2,5),l=R(2,5),m=R(1,3),n=R(2,4);math=`${k}a${m===1?'':sup(m)}b · ${l}ab${sup(n)}`;wr=[`${k+l}a^${m+1}b^${n+1}`,`${k*l}a^${m}b^${n}`];rule=`Vermenigvuldig de coëfficiënten en tel per letter de exponenten op`}
  if(t===8){const k=R(2,3),m=R(2,3),n=R(2,5);math=`(${k}${v}${sup(m)})² · ${v}${sup(n)}`;wr=[`${2*k}${v}^${2*m+n}`,`${k*k}${v}^${m+2+n}`];rule=`Eerst de macht: (${k}${v}${sup(m)})² = ${k*k}${v}${sup(2*m)}; dan exponenten optellen`}
  const target=parsePoly(math);
  return exprQ(mode,{instr:I,math,target,wrongs:wr,explain:`${rule}: <b>${fmtPoly(target)}</b>.`,vars:[...new Set(math.match(/[abxy]/g))]});
}

function genExpand(mode){
  const t=R(0,4);const I='Werk uit en vereenvoudig.';let math,expd,wr=[];
  if(t===0){const k=nzx(-4,4,[1,-1]),m=R(1,3),a=nzx(-5,5,[]),n=R(2,4),b=nz(-6,6),r=R(1,n-1);const xm=m===1?'x':'x'+sup(m),xr=r===1?'x':'x'+sup(r);
    math=`${f(k)}${xm}(${T(a,'x'+sup(n),1)}${T(b,xr)})`;expd=T(k*a,'x'+sup(m+n),1)+T(k*b,'x'+((m+r)===1?'':sup(m+r)));
    wr=[`${k*a}x^${m*n}+${k*b}x^${m*r}`,`${k*a}x^${m+n}+${b}x^${r}`,`${k*a}x^${m+n}-${k*b}x^${m+r}`]}
  if(t===1){const k=R(2,5),pp=R(1,6),q=nz(-7,7);math=`${MIN}${k}a(a² ${MIN} ${pp}a${T(q,'')})`;expd=T(-k,'a³',1)+T(k*pp,'a²')+T(-k*q,'a');
    wr=[`-${k}a^3-${k*pp}a^2-${k*q}a`,`-${k}a^3+${k*pp}a^2+${q}`,`-${k}a^2+${k*pp}a-${k*q}`]}
  if(t===2){const pp=nz(-6,6),q=nz(-6,6);math=`(x${T(pp,'')})(x²${T(q,'')})`;expd=`x³${T(q,'x')}${T(pp,'x²')}${T(pp*q,'')}`;
    wr=[`x^3+${pp*q}`,`x^2+${pp+q}x+${pp*q}`,`x^3+${q}x+${pp}x^2-${pp*q}`]}
  if(t===3){const k=R(2,4),pp=nz(-5,5),q=nz(-5,5);math=`${k}x²(x³${T(pp,'')}) ${MIN} x(x⁴${T(-q,'x')})`;expd=`${k}x⁵${T(k*pp,'x²')}${T(-1,'x⁵')}${T(q,'x²')}`;
    wr=[`${k+1}x^5+${k*pp-q}x^2`,`${k-1}x^5+${k*pp-q}x^2`,`${k-1}x^5+${k*pp}x^2`]}
  if(t===4){const pp=R(2,6),q=nz(-6,6);math=`a(a + ${pp}) ${MIN} ${pp}(a${T(q,'')})`;expd=`a²${T(pp,'a')}${T(-pp,'a')}${T(-pp*q,'')}`;
    wr=[`a^2+${2*pp}a+${-pp*q}`,`a^2+${pp*q}`,`a^2-${pp*q}+${2*pp}a`]}
  const target=parsePoly(math);
  if(Object.keys(target).length===0)return genExpand(mode);
  return exprQ(mode,{instr:I,math,target,wrongs:wr,explain:`Vermenigvuldig elke term met elke term:`+steps(math,normalize(expd)===normalize(fmtPoly(target))?[`<b>${expd}</b>`]:[expd,`<b>${fmtPoly(target)}</b>`]),vars:[...new Set(math.match(/[ax]/g))]});
}

  for(let g=0;g<100;g++){const t=R(0,6);let txt,v,ex,unit='',wr=[];
    if(t===0){const it=pick(['Een broek','Een jas','Een paar schoenen','Een rugzak']);const p=pick([10,20,25,50]);const P=(100/gcd(p,100))*R(2,20);if(P>300)continue;const k=P*p/100;v=P-k;txt=`${it} kost €${P}. Er is ${p}% korting. Wat is de nieuwe prijs (in €)?`;ex=stepsN(`korting: ${p}% van ${P}`,[`${k}`])+`<br>nieuwe prijs: ${P} − ${k} = ${fin(v)} euro`;wr=[k,P+k]}
    if(t===1){const it=pick(['Een fiets','Een gsm','Een tent','Een tablet']);const p=pick([5,10,15,20,25]);const P=(100/gcd(p,100))*R(2,30);if(P>600||P<40)continue;const k=P*p/100;if(!isInt(k))continue;v=P+k;txt=`${it} kost €${P}. De prijs stijgt met ${p}%. Wat is de nieuwe prijs (in €)?`;ex=`stijging: ${p}% van ${P} = ${k}<br>nieuwe prijs: ${P} + ${k} = ${fin(v)} euro`;wr=[k,P-k]}
    if(t===2){const p=pick([10,20,25,50,5,30,40]);const P=(100/gcd(p,100))*R(2,15);if(P>400)continue;const k=P*p/100;txt=`Een tas kost normaal €${P}. Je betaalt nu €${P-k}. Met hoeveel procent is de prijs gedaald?`;v=p;unit='%';ex=`daling: ${P} − ${P-k} = ${k} euro.<br>${k} euro op ${P} euro is evenveel als ${p} op 100 (${k} : ${P/100} = ${p}), dus ${fin(p+'%')}`;wr=[k,100-p]}
    if(t===3){const p=pick([40,60,45,55,30,70]);const N=pick([200,300,400,500,600]);const m=N*p/100;v=N-m;txt=`Een school telt ${N} leerlingen, waarvan ${p}% meisjes zijn. Hoeveel jongens zijn er?`;ex=`jongens: 100% − ${p}% = ${100-p}%<br>${100-p}% van ${N} = ${fin(v)}`;wr=[m,100-p]}
    if(t===4){const p=pick([10,20]);const P=100*R(1,5);const a=P-P*p/100,b=a-a*p/100;if(!isInt(b))continue;v=b;txt=`Een toestel kost €${P}. Eerst krijg je ${p}% korting, en op de nieuwe prijs nog eens ${p}% korting. Wat is de uiteindelijke prijs (in €)?`;ex=`na 1e korting: ${P} − ${P*p/100} = ${a}<br>na 2e korting: ${a} − ${a*p/100} = ${fin(b)} euro<br>Let op: dat is niet hetzelfde als ${2*p}% korting (${P-P*2*p/100} euro).`;wr=[P-P*2*p/100,a]}
    if(t===5){const p=pick([2,3,4,5]);const K=100*R(2,9);const i=K*p/100;v=K+i;txt=`Een spaarrekening van €${K} groeit met ${p}% per jaar (enkelvoudige intrest). Hoeveel staat er na 1 jaar op de rekening (in €)?`;ex=`intrest: ${p}% van ${K} = ${i}<br>na 1 jaar: ${K} + ${i} = ${fin(v)} euro`;wr=[i,K+p]}
    if(t===6){const p=pick([4,8,10,20,5,6]);const N=pick([50,100,150,200,250,300]);const r=N*p/100;if(!isInt(r))continue;v=N-r;const fr=pick(['appels in een krat','eieren in een doos','tomaten in een kist']);txt=`Van de ${N} ${fr} is ${p}% rot. Hoeveel zijn er nog goed?`;ex=`rot: ${p}% van ${N} = ${r}<br>goed: ${N} − ${r} = ${fin(v)}`;wr=[r,N-p]}
    if(v===undefined||!isInt(v))continue;
    const q=numQ(mode,{instr:'Los het vraagstuk op.',math:txt,v,wrongs:wr,explain:ex,unit});q.wordy=true;return q}
}

const RECHT=[

 {t:(x1,y1,x2)=>`Een groep van ${x1} leerlingen verzamelt €${y1} voor een goed doel. Hoeveel euro verzamelen ${x2} leerlingen aan hetzelfde tempo?`,xu:'leerlingen',yu:'euro',g:[1,1,2],ym:[6,8,10,12,15]},
 {t:(x1,y1,x2)=>`Voor een muur van ${x1} m² heb je ${y1} stenen nodig. Hoeveel stenen heb je nodig voor ${x2} m²?`,xu:'m²',yu:'stenen',g:[1,1,3],ym:[30,35,40,50]}];

 {t:(x1,y1,x2)=>`Bij een snelheid van ${x1} km/u doet een fietser een tocht in ${y1} uur. Hoeveel uur doet hij erover bij ${x2} km/u?`,xu:'km/u',yu:'uur',sp:true}];
function ratioTable(rows){return `<div class="tbl-wrap"><table class="tbl rt">${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`}
function makeRecht(){const c=pick(RECHT);for(let g=0;g<200;g++){const gs=pick(c.g),ym=pick(c.ym);const m1=R(2,9),m2=R(2,12);if(m1===m2)continue;
    const x1=gs*m1,x2=gs*m2,y1=ym*m1,y2=ym*m2;if(x1>500||x2>500)continue;return {c,x1,x2,y1,y2,gs,ym,m1,m2}}}
function makeOmg(){const c=pick(OMG);for(let g=0;g<300;g++){const P=c.sp?pick([180,240,360,120,300]):pick([60,72,90,120,144,180,240,360]);const ds=[];for(let d=2;d<P;d++)if(P%d===0)ds.push(d);
    const pool=c.sp?ds.filter(d=>d>=10&&d<=120&&P/d<=24):ds.filter(d=>d<=30&&P/d<=60);if(pool.length<2)continue;const x1=pick(pool),x2=pick(pool);if(x1===x2)continue;return {c,x1,x2,y1:P/x1,y2:P/x2,P}}}

function genOmg(mode){const o=makeOmg();const {c,x1,x2,y1,y2,P}=o;

<script>
(function(){

   <div class="row" style="align-items:flex-end"><div class="field" style="flex:1 1 220px;display:grid;gap:6px"><label for="nm" style="font-weight:800">Naam van de kandidaat</label><input id="nm" maxlength="20" value="${esc(S.name)}" placeholder="Je voornaam" autocomplete="off"></div>

   <div class="row"><button class="btn" id="go">Start de show</button><button class="btn ghost" id="rnd">Verrassingsbord</button><button class="btn ghost small" id="weak" title="Kies je rubrieken met de laagste score">Mijn zwakste rubrieken</button></div><p class="warn" id="warn" hidden></p>

function boardScreen(){window.scrollTo(0,0);const G=S.game;const n=G.cats.length;
  const left=G.tiles.filter(t=>!t.done).length;
  app.innerHTML=`<div class="hud"><div><p class="eyebrow">Kandidaat</p><h2 style="font-size:1.6rem">${esc(S.name)}</h2></div>
   <div class="row"><div class="score" aria-label="Score">${G.score}<small>punten</small></div><button class="btn ghost small" id="stop">${left?'Stop de show':'Bekijk je score'}</button></div></div>
  <section class="stage bordstage"><div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${n},minmax(0,1fr))">
   ${G.cats.map(id=>{const c=C(id);return `<div class="colhead ${setCls(c)}">${setBadge(c)}<span class="long">${c.name}</span><span class="short">${c.short}</span></div>`}).join('')}
   ${VALUES.map(v=>G.cats.map(id=>{const c=C(id),i=G.tiles.findIndex(t=>t.cat===id&&t.val===v),t=G.tiles[i];
     return `<button class="tile ${setCls(c)}${t.done?(t.ok?' ok':' no'):''}" data-i="${i}" ${t.done?'disabled':''} aria-label="${c.name}, ${v} punten${t.done?(t.ok?', juist':', fout'):''}">${t.done?(t.ok?`✓ ${t.pts}`:'✗'):v}</button>`}).join('')).join('')}
  </div></div></section>
  <p class="hint">100 en 200: meerkeuze · 300: zelf invullen · 400 en 500: moeilijker, zelf invullen. Twee tegels verbergen een joker (dubbele punten).</p>`;
  app.querySelectorAll('.tile:not(:disabled)').forEach(b=>b.onclick=()=>playTile(+b.dataset.i));
  document.getElementById('stop').onclick=endScreen;
}
/* ---------- vraag ---------- */
let Q=null;
function playTile(i){window.scrollTo(0,0);const G=S.game,t=G.tiles[i],c=C(t.cat);const q=makeTile(c,t.val);Q={i,q,c,t};let ans='';
  if(q.options)ans=`<div class="opts ${q.layout||''}">${q.options.map((o,k)=>`<button class="opt" data-k="${k}">${o.label}</button>`).join('')}</div>`;
  else if(q.kind==='nl')ans=`<div class="nlbox">${nlZ()}</div><p class="hint">Klik op het juiste streepje.</p>`;
  else if(q.kind==='grid')ans=`<div class="svgbox">${gridSVG([],true)}</div><p class="hint">Klik op het snijpunt van de rasterlijnen.</p>`;
  else if(q.kind==='place')ans=`<div class="nlbox">${nlN()}</div><p class="hint">Klik op het juiste streepje.</p>`;
  else if(q.kind==='set')ans=`<div class="nlbox">${nlN()}</div><div class="row" style="justify-content:space-between"><p class="hint">Klik elk getal aan dat voldoet. Nog eens klikken = weghalen.</p><button class="btn" id="chk">Controleer</button></div><p class="warn" id="warn" hidden></p>`;
  else{const keys=q.kind==='coord'?['(','−',',',')']:q.kind==='expr'?['−',...(q.vars&&q.vars.length?q.vars:['a','b']),'²','³','⁴','⁵','^','(',')']:q.kind==='intbn'?['−','bestaat niet']:q.kind==='num'?[]:['−'];
    ans=`<form class="typein" id="tf" autocomplete="off"><div class="line"><input id="ti" aria-label="Je antwoord" placeholder="${esc(HINTS[c.id]||'Je antwoord')}" ${q.kind==='num'?'inputmode="numeric"':''} autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Controleer</button></div>
     ${keys.length?`<div class="keys">${keys.map(k=>`<button type="button" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>`:''}${q.unit?`<p class="hint">Antwoord in ${esc(q.unit)}.</p>`:''}<p class="warn" id="warn" hidden></p></form>`}
  app.innerHTML=`<section class="stage qcard ${setCls(c)}">
   <div class="qhead"><span class="pill">${setBadge(c)} ${c.name} · ${t.val}</span><button class="btn ghost small" id="back">Terug naar het bord</button></div>
   ${t.joker?`<div class="joker"><b>JOKER!</b> Deze vraag telt dubbel: ${t.val*2} punten.</div>`:''}
   <p class="instr">${q.instr}</p><div class="math${q.layout==='words'||q.wordy||(q.visual&&q.kind!=='grid')?' small':''}">${q.math}</div>
   ${q.visual||''}${q.grid?`<div class="svgbox">${gridSVG(q.grid.points,false)}</div>`:''}${ans}<div id="fb"></div></section>`;
  document.getElementById('back').onclick=boardScreen;
  if(q.options)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=q.options[+b.dataset.k];app.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(q.options[k].correct)x.classList.add('right')});if(!o.correct)b.classList.add('wrong');resolve(o.correct)});
  else if(q.kind==='nl')bindLine(q,app.querySelector('.nlbox svg'),NXZ);
  else if(q.kind==='place')bindLine(q,app.querySelector('.nlbox svg'),NXN);
  else if(q.kind==='set')bindSet(q);
  else if(q.kind==='grid')bindGrid(q);
  else{const inp=document.getElementById('ti'),warn=document.getElementById('warn');inp.focus({preventScroll:true});
    app.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='bestaat niet')inp.value=k;else{const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??s;inp.value=inp.value.slice(0,s)+k+inp.value.slice(e);inp.setSelectionRange(s+k.length,s+k.length)}inp.focus()});
    document.getElementById('tf').onsubmit=e=>{e.preventDefault();const r=checkAny(q,inp.value);if(r.status==='empty'||r.status==='format'){warn.hidden=false;warn.textContent=r.msg;return}
      inp.disabled=true;app.querySelectorAll('#tf button').forEach(b=>b.disabled=true);resolve(r.status==='ok')}}
}
function resolve(ok){const {q,c,t}=Q;const G=S.game;const pts=ok?t.val*(t.joker?2:1):0;
  t.done=true;t.ok=ok;t.pts=pts;G.score+=pts;const st=S.stats[c.id]||(S.stats[c.id]={ok:0,n:0});st.n++;if(ok)st.ok++;save();
  const left=G.tiles.filter(x=>!x.done).length;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?`Juist! +${pts}`:'Helaas, geen punten'}</h3>
   ${ok?'':`<p>Het juiste antwoord is <b>${q.answerLabel}</b>.</p>`}<div>${q.explain}</div>
   <div class="row"><button class="btn" id="nx">${left?'Terug naar het bord':'Bekijk je score'}</button></div></div>`;
  const b=document.getElementById('back');if(b)b.remove();
  const nx=document.getElementById('nx');nx.focus({preventScroll:true});document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  nx.onclick=()=>left?boardScreen():endScreen()}
/* ---------- einde ---------- */
function endScreen(){window.scrollTo(0,0);const G=S.game;if(!G)return startScreen();
  const played=G.tiles.filter(t=>t.done),ok=played.filter(t=>t.ok).length;const max=G.tiles.reduce((s,t)=>s+t.val,0);
  const rec=G.score>S.best;if(played.length){S.shows++;if(rec)S.best=G.score}S.game=null;save();
  const per=G.cats.map(id=>{const ts=G.tiles.filter(t=>t.cat===id&&t.done);return {c:C(id),n:ts.length,ok:ts.filter(t=>t.ok).length}}).filter(x=>x.n);
  app.innerHTML=`<section class="stage result"><p class="eyebrow">Einde van de show</p><h2 style="font-size:2rem">${esc(S.name)}, je score is</h2><div class="big">${G.score}</div>
   <p>${ok} van ${played.length} vragen juist${rec&&played.length?' · <b>Nieuw persoonlijk record!</b>':''} · maximum op dit bord: ${max} (zonder jokers)</p>
   ${per.length?`<div class="stats" style="width:100%;max-width:520px;text-align:left">${per.map(x=>`<div class="srow ${setCls(x.c)}"><span class="nm">${setBadge(x.c)}${x.c.name}</span><span class="track"><i style="width:${Math.round(100*x.ok/x.n)}%"></i></span><span class="pc">${x.ok}/${x.n}</span></div>`).join('')}</div>`:''}
   <div class="row" style="justify-content:center"><button class="btn" id="again">Nieuwe show</button></div></section>`;
  document.getElementById('again').onclick=startScreen}

/* ---------- getallenassen ---------- */
const NXZ=n=>30+(n+10)*28,NXN=n=>26+n*28.4;
function axis(range,X,labelEvery,fs){let s=`<svg viewBox="0 0 620 100" role="group" aria-label="Getallenas"><line x1="12" y1="48" x2="606" y2="48" stroke="var(--ink)" stroke-width="2"/><path d="M608 48 l-10 -5 v10z" fill="var(--ink)"/>`;
  for(let n=range[0];n<=range[1];n++){const x=X(n),big=n===0||n%5===0;s+=`<line x1="${x}" y1="${big?32:38}" x2="${x}" y2="${big?64:58}" stroke="var(--ink)" stroke-width="${big?3:1.8}"/>`;
    if(n%labelEvery===0)s+=`<text x="${x}" y="90" text-anchor="middle" font-size="${n%10===0?fs+3:fs}" font-weight="${n===0?800:400}" fill="var(--ink)" font-family="Figtree,sans-serif">${n<0?'−'+(-n):n}</text>`;
    s+=`<circle class="dot" data-n="${n}" cx="${x}" cy="48" r="12" fill="transparent"/><rect class="hit" data-n="${n}" x="${x-14}" y="4" width="28" height="94" fill="transparent" style="cursor:pointer"><title>${n}</title></rect>`}
  return s+'<g id="marks"></g></svg>'}
const nlZ=()=>axis([-10,10],NXZ,2,21),nlN=()=>axis([0,20],NXN,2,22);
function bindLine(q,svg,X){let busy=false;const L=q.letter||'';
  const mk=(v,col)=>`<g><path d="M${X(v)},42 l-9,-16 h18z" fill="${col}"/><text x="${X(v)}" y="20" text-anchor="middle" font-size="17" font-family="Bowlby One,sans-serif" fill="${col}">${L}</text></g>`;
  svg.querySelectorAll('.hit').forEach(h=>h.addEventListener('click',()=>{if(busy)return;busy=true;const n=+h.dataset.n,ok=n===q.value;svg.querySelector('#marks').innerHTML=(ok?'':mk(n,'var(--no)'))+mk(q.value,'var(--ok)');resolve(ok)}))}
function bindSet(q){const svg=app.querySelector('.nlbox svg'),sel=new Set(),warn=document.getElementById('warn');let busy=false;
  const paint=()=>svg.querySelectorAll('.dot').forEach(d=>d.setAttribute('fill',sel.has(+d.dataset.n)?'var(--gold)':'transparent'));
  svg.querySelectorAll('.hit').forEach(h=>h.addEventListener('click',()=>{if(busy)return;const n=+h.dataset.n;sel.has(n)?sel.delete(n):sel.add(n);warn.hidden=true;paint()}));
  document.getElementById('chk').onclick=()=>{if(busy)return;if(!sel.size){warn.hidden=false;warn.textContent='Duid eerst getallen aan.';return}busy=true;document.getElementById('chk').disabled=true;
    const ok=sel.size===q.value.length&&q.value.every(x=>sel.has(x));if(!ok){sel.clear();q.value.forEach(x=>sel.add(x));paint()}resolve(ok)}}
/* ---------- rooster ---------- */
const U=22,O=160;
function gridSVG(points,interactive){let s=`<svg viewBox="0 0 320 320" ${interactive?'class="clickgrid" role="group" aria-label="Assenstelsel, klik op een roosterpunt"':'role="img" aria-label="Assenstelsel"'}>`;
  for(let i=-6;i<=6;i++){const c=O+i*U;s+=`<line x1="${c}" y1="${O-6*U}" x2="${c}" y2="${O+6*U}" stroke="var(--line)"/><line x1="${O-6*U}" y1="${c}" x2="${O+6*U}" y2="${c}" stroke="var(--line)"/>`}
  s+=`<line x1="${O-6*U-8}" y1="${O}" x2="${O+6*U+10}" y2="${O}" stroke="var(--ink)" stroke-width="1.8"/><line x1="${O}" y1="${O+6*U+8}" x2="${O}" y2="${O-6*U-10}" stroke="var(--ink)" stroke-width="1.8"/><text x="${O+6*U+6}" y="${O+16}" class="gtxt" font-weight="800">x</text><text x="${O+8}" y="${O-6*U-4}" class="gtxt" font-weight="800">y</text>`;
  for(let i=-6;i<=6;i++){if(!i)continue;if(i%2===0)s+=`<text x="${O+i*U}" y="${O+14}" text-anchor="middle" class="gtxt">${i<0?'−'+(-i):i}</text><text x="${O-6}" y="${O-i*U+4}" text-anchor="end" class="gtxt">${i<0?'−'+(-i):i}</text>`;s+=`<line x1="${O+i*U}" y1="${O-3}" x2="${O+i*U}" y2="${O+3}" stroke="var(--ink)"/><line x1="${O-3}" y1="${O-i*U}" x2="${O+3}" y2="${O-i*U}" stroke="var(--ink)"/>`}
  for(const p of points)s+=pt(p.x,p.y,p.label,'var(--gold)');
  if(interactive)s+=`<g id="hov"></g><g id="gm"></g><rect id="gc" width="320" height="320" fill="transparent" style="cursor:crosshair"/>`;return s+'</svg>'}
function pt(x,y,L,col){const cx=O+x*U,cy=O-y*U;return `<g><circle cx="${cx}" cy="${cy}" r="6" fill="${col}" stroke="var(--ink)" stroke-width="1.5"/><text x="${cx+8}" y="${cy-8}" font-family="Bowlby One,sans-serif" font-size="14" fill="var(--ink)" stroke="var(--stage)" stroke-width="3" paint-order="stroke">${L}</text></g>`}
function bindGrid(q){const svg=app.querySelector('.clickgrid');let busy=false;const toPt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const l=p.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(-6,Math.min(6,Math.round((l.x-O)/U))),y:Math.max(-6,Math.min(6,Math.round((O-l.y)/U)))}};
  const c=svg.querySelector('#gc'),hov=svg.querySelector('#hov');
  c.addEventListener('pointermove',e=>{if(busy)return;const g=toPt(e);hov.innerHTML=`<circle cx="${O+g.x*U}" cy="${O-g.y*U}" r="7" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`});
  c.addEventListener('click',e=>{if(busy)return;busy=true;hov.innerHTML='';const g=toPt(e),ok=g.x===q.value.x&&g.y===q.value.y;svg.querySelector('#gm').innerHTML=(ok?'':pt(g.x,g.y,'?','var(--no)'))+pt(q.value.x,q.value.y,q.letter,'var(--ok)');resolve(ok)})}

startScreen();
})();
</script>
