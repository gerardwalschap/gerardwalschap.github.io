<title>Grafiekdetective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one centred "dossier" column on millimeter paper; case card, graph, question, feedback stack vertically */
:root{
  --paper:#F7FAFD; --grid:#DCE7F2; --grid-strong:#C3D5E8;
  --ink:#1F2A36; --muted:#5B6B7C; --navy:#1F4E79; --card:#FFFFFF; --line:#D3DEE9;
  --marker:#E36C09; --marker-soft:#FDEBDC; --good:#1E7D4F; --good-soft:#E2F3EA; --bad:#B4322A; --bad-soft:#F8E3E1;
  --curve:#1F4E79; --shadow:0 1px 2px rgba(31,78,121,.08),0 6px 20px rgba(31,78,121,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1822; --grid:#1A2735; --grid-strong:#243548; --ink:#E6EEF6; --muted:#97A9BB; --navy:#8DB8E3; --card:#152230; --line:#2A3B4E;
  --marker:#F28A3A; --marker-soft:#3A2617; --good:#5CC891; --good-soft:#15321F; --bad:#F07B71; --bad-soft:#3A1A18; --curve:#8DB8E3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1822; --grid:#1A2735; --grid-strong:#243548; --ink:#E6EEF6; --muted:#97A9BB; --navy:#8DB8E3; --card:#152230; --line:#2A3B4E;
  --marker:#F28A3A; --marker-soft:#3A2617; --good:#5CC891; --good-soft:#15321F; --bad:#F07B71; --bad-soft:#3A1A18; --curve:#8DB8E3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),
  linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);
  background-size:10px 10px,10px 10px,50px 50px,50px 50px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,svg:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--marker)}
.btn{border:0;border-radius:999px;padding:12px 26px;font-weight:700;background:var(--navy);color:var(--card);font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}

/* start */
.hero{padding:28px 24px}
.hero h1{font-size:clamp(2.4rem,7vw,3.6rem);font-weight:800;color:var(--navy);letter-spacing:-.02em}
.hero h1 span{color:var(--marker)}
.hero p{max-width:58ch;color:var(--ink);margin:12px 0 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:20px 0}
.rule{border:1px dashed var(--grid-strong);border-radius:10px;padding:12px 14px;font-size:.95rem}
.rule b{display:block;font-family:var(--f-display);font-size:1.05rem;color:var(--navy)}
.startrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--card)}
.best{color:var(--muted);font-size:.95rem}

/* hud */
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.progress{flex:1 1 200px;height:10px;border-radius:99px;background:var(--grid-strong);overflow:hidden}
.progress i{display:block;height:100%;background:var(--marker);width:0;transition:width .4s}
.stat{font-weight:700}.stat small{font-weight:400;color:var(--muted);margin-right:4px}
.streak{color:var(--marker)}

/* case */
.case h2{font-size:1.45rem;color:var(--navy)}
.case p{margin:6px 0 0}
.formula{display:inline-block;margin-top:10px;font-weight:700;color:var(--navy);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums}
.graphbox{margin-top:14px;overflow-x:auto}
svg.graph{display:block;width:100%;height:auto;max-width:100%;touch-action:manipulation;user-select:none}
svg.graph.clickable{cursor:crosshair}
.g-grid{stroke:var(--grid-strong);stroke-width:1}
.g-axis{stroke:var(--muted);stroke-width:1.5}
.g-tick{fill:var(--muted);font:13px var(--f-body);font-variant-numeric:tabular-nums}
.g-lab{fill:var(--ink);font:600 13px var(--f-body)}
.g-curve{fill:none;stroke:var(--curve);stroke-width:3;stroke-linejoin:round}
.g-guide{stroke:var(--marker);stroke-width:1.5;stroke-dasharray:4 4}
.g-dot{fill:var(--marker);stroke:var(--card);stroke-width:2}
.g-ok{fill:var(--good);stroke:var(--card);stroke-width:2}
.g-no{fill:var(--bad);stroke:var(--card);stroke-width:2}
.g-mark{stroke:var(--marker);stroke-width:2;stroke-dasharray:6 4;fill:none}
.g-seg{fill:none;stroke:var(--marker);stroke-width:7;stroke-linecap:round;opacity:.55}
.g-band{fill:var(--marker);opacity:.2}
.g-mlab{fill:var(--marker);font:700 13px var(--f-body);paint-order:stroke;stroke:var(--card);stroke-width:4px}

/* question */
.q h3{font-size:1.25rem;font-weight:700}
.hint{color:var(--muted);font-size:.95rem;margin-top:6px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--paper);color:var(--navy);border:1px solid var(--line);font-size:.9rem}
.opt span:last-child{min-width:0}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:14px 16px;margin-top:14px}
.feedback.good{background:var(--good-soft);border:1px solid var(--good)}
.feedback.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.feedback b.v{font-family:var(--f-display);font-size:1.15rem;display:block;margin-bottom:2px}
.feedback.good b.v{color:var(--good)}.feedback.bad b.v{color:var(--bad)}
.nextrow{display:flex;justify-content:flex-end;margin-top:14px}
.pop{font-weight:700;color:var(--good);margin-left:6px}

/* end */
.end h2{font-size:2rem;color:var(--navy)}
.rank{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6vw,2.6rem);color:var(--marker);margin:6px 0}
.big{display:flex;gap:28px;flex-wrap:wrap;margin:14px 0;font-variant-numeric:tabular-nums}
.big div{font-size:.9rem;color:var(--muted)}
.big b{display:block;font-family:var(--f-display);font-size:2.2rem;color:var(--ink);line-height:1}
.review{display:grid;gap:10px;margin-top:10px}
.review .item{border-left:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem}
.review .item b{color:var(--navy)}
@media (max-width:520px){.g-tick{font-size:20px}.g-lab{font-size:20px}.g-mlab{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
</style>

(function(){

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Situaties ---------- */
const CASES=[

/* ---------- Grafiek ---------- */
const W=640,H=380,M={l:62,r:18,t:16,b:50};
function makeGraph(c){
  const sx=x=>M.l+(x-c.x[0])/(c.x[1]-c.x[0])*(W-M.l-M.r);
  const sy=y=>H-M.b-(y-c.y[0])/(c.y[1]-c.y[0])*(H-M.t-M.b);
  const ix=px=>c.x[0]+(px-M.l)/(W-M.l-M.r)*(c.x[1]-c.x[0]);
  let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafiek van ${c.formula}">`;
  for(let x=c.x[0];x<=c.x[1]+1e-9;x+=c.xt){s+=`<line class="g-grid" x1="${sx(x)}" x2="${sx(x)}" y1="${sy(c.y[0])}" y2="${sy(c.y[1])}"/><text class="g-tick" x="${sx(x)}" y="${H-M.b+18}" text-anchor="middle">${fmt(x)}</text>`}
  for(let y=c.y[0];y<=c.y[1]+1e-9;y+=c.yt){s+=`<line class="g-grid" x1="${sx(c.x[0])}" x2="${sx(c.x[1])}" y1="${sy(y)}" y2="${sy(y)}"/><text class="g-tick" x="${M.l-8}" y="${sy(y)+4}" text-anchor="end">${fmt(y)}</text>`}
  const y0=Math.max(c.y[0],0);
  s+=`<line class="g-axis" x1="${sx(c.x[0])}" x2="${sx(c.x[1])}" y1="${sy(y0)}" y2="${sy(y0)}"/><line class="g-axis" x1="${sx(c.x[0])}" x2="${sx(c.x[0])}" y1="${sy(c.y[0])}" y2="${sy(c.y[1])}"/>`;
  s+=`<text class="g-lab" x="${(M.l+W-M.r)/2}" y="${H-10}" text-anchor="middle">${c.xl}</text>`;
  s+=`<text class="g-lab" transform="translate(16 ${(M.t+H-M.b)/2}) rotate(-90)" text-anchor="middle">${c.yl}</text>`;
  let d="";for(let i=0;i<=300;i++){const x=c.x[0]+i/300*(c.x[1]-c.x[0]);d+=(i?"L":"M")+sx(x).toFixed(1)+" "+sy(c.f(x)).toFixed(1)}
  s+=`<g class="marks"></g><path class="g-curve" d="${d}"/><g class="over"></g>`;
  s+=`<rect class="hit" x="${M.l}" y="${M.t}" width="${W-M.l-M.r}" height="${H-M.t-M.b}" fill="transparent"/></svg>`;
  return {html:s,sx,sy,ix};
}
function curvePath(c,g,a,b){let d="";for(let i=0;i<=120;i++){const x=a+i/120*(b-a);d+=(i?"L":"M")+g.sx(x).toFixed(1)+" "+g.sy(c.f(x)).toFixed(1)}return d}
function drawMarks(svg,c,g,marks){
  const under=svg.querySelector(".marks"),over=svg.querySelector(".over");let u="",o="";
  const base=g.sy(Math.max(c.y[0],0));
  for(const m of marks){
    if(m.k==="pt"){const y=c.f(m.x),X=g.sx(m.x),Y=g.sy(y);o+=`<circle class="g-dot" cx="${X}" cy="${Y}" r="7"/>`;
      if(m.l){const right=X<W-170;o+=`<text class="g-mlab" x="${X+(right?12:-12)}" y="${Y-12}" text-anchor="${right?"start":"end"}">${m.l}</text>`}}
    if(m.k==="h"){const Y=g.sy(m.y);u+=`<line class="g-mark" x1="${g.sx(c.x[0])}" x2="${g.sx(c.x[1])}" y1="${Y}" y2="${Y}"/>`;if(m.l)o+=`<text class="g-mlab" x="${g.sx(c.x[1])-4}" y="${Y-8}" text-anchor="end">${m.l}</text>`}
    if(m.k==="seg"){o+=`<path class="g-seg" d="${curvePath(c,g,m.a,m.b)}"/>`}
    if(m.k==="band"){u+=`<path class="g-band" d="${curvePath(c,g,m.a,m.b)}L${g.sx(m.b)} ${base}L${g.sx(m.a)} ${base}Z"/>`}
  }
  under.innerHTML=u;over.insertAdjacentHTML("beforeend",o);
}

/* ---------- Spel ---------- */
const app=document.getElementById("app");
const S={n:10,list:[],i:0,score:0,streak:0,right:0,log:[]};
const RANKS=[[0,"Leerling-speurder"],[50,"Rechercheur"],[75,"Inspecteur"],[90,"Hoofdinspecteur"]];

function startScreen(){
  const best=+store.get("gd-best")||0;
  app.innerHTML=`<section class="panel hero">
    <div class="eyebrow">Wiskunde 5WW · Veeltermfuncties in context</div>
    <h1>Grafiek<span>detective</span></h1>
    <p>Elke grafiek vertelt een verhaal. Lees de kenmerken af en zoek uit wat ze betekenen in de situatie: een pretpark, een klaskas, een drone, een foodtruck …</p>
    <div class="rules">
      <div class="rule"><b>Kies het juiste antwoord</b>Welke uitleg past bij de grafiek en de situatie?</div>
      <div class="rule"><b>Klik op de grafiek</b>Duid zelf het juiste moment of punt aan.</div>
      <div class="rule"><b>Bouw een reeks op</b>100 punten per juist antwoord, plus een bonus voor elke reeks.</div>
    </div>
    <div class="startrow">
      <div class="chips" role="group" aria-label="Aantal vragen">${[10,15,20].map(n=>`<button class="chip" id="n${n}" aria-pressed="${n===S.n}" data-n="${n}">${n} vragen</button>`).join("")}</div>
      <button class="btn" id="go">Start het onderzoek</button>
      ${best?`<span class="best">Jouw record: <b>${best}</b> punten</span>`:""}
    </div></section>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;app.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  document.getElementById("go").onclick=newGame;
}
function newGame(){
  // Spread questions over cases: round-robin through shuffled cases
  const pools=shuffle(CASES).map(c=>shuffle(c.qs.map(q=>({c,q}))));let list=[];
  while(list.length<S.n&&pools.some(p=>p.length))for(const p of pools){if(p.length&&list.length<S.n)list.push(p.pop())}
  // keep questions of one case together where possible, case order random
  const order=shuffle([...new Set(list.map(x=>x.c.id))]);
  list.sort((a,b)=>order.indexOf(a.c.id)-order.indexOf(b.c.id));
  Object.assign(S,{list,i:0,score:0,streak:0,right:0,log:[]});
  showQuestion();
}
function hud(){
  return `<div class="hud"><span class="stat"><small>Vraag</small>${S.i+1}/${S.list.length}</span>
  <div class="progress" aria-hidden="true"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <span class="stat"><small>Punten</small><span id="pts">${S.score}</span></span>
  <span class="stat streak">${S.streak>1?"reeks ×"+S.streak:""}</span></div>`;
}
function showQuestion(){
  const {c,q}=S.list[S.i];const g=makeGraph(c);
  const opts=q.t==="mc"?shuffle(q.o.map((t,i)=>({t,ok:i===0}))):null;
  app.innerHTML=`${hud()}
  <section class="panel case"><div class="eyebrow">Dossier</div><h2>${c.title}</h2><p>${c.intro}</p>
   <span class="formula">${c.formula}</span><div class="graphbox">${g.html}</div></section>
  <section class="panel q" id="q"><h3>${q.q}</h3>
   ${q.t==="click"?`<p class="hint">Klik of tik op de grafiek. Met het toetsenbord: pijltjes om te verschuiven, Enter om te kiezen.</p>`:
   `<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${o.t}</span></button>`).join("")}</div>`}
   <div id="fb"></div></section>`;
  const svg=app.querySelector("svg.graph");
  if(q.t==="mc"){
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.i];app.querySelectorAll(".opt").forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add("right")});
      if(!o.ok)b.classList.add("wrong");
      answer(o.ok,svg,c,g,q,o.ok?null:o.t);
    });
    app.querySelector(".opt").focus({preventScroll:true});
  }else{
    svg.classList.add("clickable");svg.setAttribute("tabindex","0");
    const over=svg.querySelector(".over");let gx=(c.x[0]+c.x[1])/2,done=false;
    const guide=()=>{if(done)return;const X=g.sx(gx),Y=g.sy(c.f(gx));over.innerHTML=`<line class="g-guide" x1="${X}" x2="${X}" y1="${M.t}" y2="${H-M.b}"/><circle class="g-dot" cx="${X}" cy="${Y}" r="6"/>`};
    const toX=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const l=p.matrixTransform(svg.getScreenCTM().inverse());return Math.min(c.x[1],Math.max(c.x[0],g.ix(l.x)))};
    const pick=x=>{if(done)return;done=true;svg.classList.remove("clickable");const ok=q.ok(x);
      over.innerHTML=`<line class="g-guide" x1="${g.sx(x)}" x2="${g.sx(x)}" y1="${M.t}" y2="${H-M.b}"/><circle class="${ok?"g-ok":"g-no"}" cx="${g.sx(x)}" cy="${g.sy(c.f(x))}" r="8"/>`;
      answer(ok,svg,c,g,q,null)};
    svg.addEventListener("pointermove",e=>{gx=toX(e);guide()});
    svg.addEventListener("pointerleave",()=>{if(!done)over.innerHTML=""});
    svg.addEventListener("click",e=>pick(toX(e)));
    svg.addEventListener("keydown",e=>{const st=(c.x[1]-c.x[0])/96;
      if(e.key==="ArrowRight"||e.key==="ArrowUp"){gx=Math.min(c.x[1],gx+st);guide();e.preventDefault()}
      if(e.key==="ArrowLeft"||e.key==="ArrowDown"){gx=Math.max(c.x[0],gx-st);guide();e.preventDefault()}
      if(e.key==="Enter"||e.key===" "){pick(gx);e.preventDefault()}});
    svg.addEventListener("focus",guide);
  }
}
function answer(ok,svg,c,g,q,wrongText){
  let gain=0;
  if(ok){S.streak++;S.right++;gain=100+Math.min(S.streak-1,5)*20;S.score+=gain}else{S.streak=0;S.log.push({c,q,wrongText})}
  drawMarks(svg,c,g,q.m);
  const fb=document.getElementById("fb");const last=S.i===S.list.length-1;
  fb.innerHTML=`<div class="feedback ${ok?"good":"bad"}" role="status"><b class="v">${ok?"Juist!":"Niet helemaal."}${ok?`<span class="pop">+${gain}</span>`:""}</b>${q.u}</div>
   <div class="nextrow"><button class="btn" id="next">${last?"Bekijk je resultaat":"Volgende vraag"}</button></div>`;
  document.getElementById("pts").textContent=S.score;
  document.querySelector(".hud .streak").textContent=S.streak>1?"reeks ×"+S.streak:"";
  if(!ok)document.getElementById("q").classList.add("shake");
  const nb=document.getElementById("next");nb.onclick=()=>{S.i++;S.i<S.list.length?showQuestion():endScreen();window.scrollTo({top:0})};
  nb.focus({preventScroll:true});fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function endScreen(){
  const pct=Math.round(S.right/S.list.length*100);const rank=RANKS.filter(r=>pct>=r[0]).pop()[1];
  const best=+store.get("gd-best")||0;const rec=S.score>best;if(rec)store.set("gd-best",S.score);
  app.innerHTML=`<section class="panel end"><div class="eyebrow">Onderzoek afgerond</div><h2>Jouw rang</h2><div class="rank">${rank}</div>
   <div class="big"><div><b>${S.score}</b>punten${rec?" · nieuw record!":""}</div><div><b>${S.right}/${S.list.length}</b>juist</div><div><b>${pct}%</b>score</div></div>
   ${S.log.length?`<h3 style="margin-top:18px">Nog eens bekijken</h3><div class="review">${S.log.map(l=>`<div class="item"><b>${l.c.title}:</b> ${l.q.q}<br>${l.q.u}</div>`).join("")}</div>`:`<p>Alles juist. Knap speurwerk!</p>`}
   <div class="startrow" style="margin-top:20px"><button class="btn" id="again">Nieuw onderzoek</button><button class="btn ghost" id="home">Naar het begin</button></div></section>`;
  document.getElementById("again").onclick=newGame;document.getElementById("home").onclick=startScreen;
}
startScreen();
})();
</script>
